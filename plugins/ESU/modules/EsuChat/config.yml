module-enabled: false
chat:
  enabled: true

  # 'player' 是游戏内玩家看到的消息；'console' 是控制台看到的消息。
  format:
    player: \<<pd:sender>> <message>
    console: <#48c0c0>\<<pd:sender>> <message>

  # 启用此功能后，玩家只能收到同世界中附近玩家的公屏聊天消息。
  ranged-chat:
    enabled: false
    radius: 5000

    # 拥有 `esu.esuchat.chat.shout` 权限的玩家可以使用这个前缀发出全服聊天。
    # 玩家默认拥有此权限。
    # 需要在 prefixed-message-modifiers 的前缀前使用此前缀。
    shout-prefix: '!'
    shout-format:
      player: \<<pd:sender>> <pl:shout><message>
      console: <#48c0c0>\<<pd:sender>> <pl:shout><message>

  # 若玩家发送的消息以 'message-prefix' 开头,
  # 则聊天消息会被更改为 'format'。
  # 可以修改消息格式。
  prefixed-message-modifiers:
    - message-prefix: '>'
      remove-prefix: false
      permission: ''
      format: <green><message></green>
    - message-prefix: '*'
      remove-prefix: true
      permission: ''
      format: <gradient:#c8b3fd:#4bacc8><message></gradient>
emote:
  # 启用 ESU emote/me 指令.
  enabled: true
  format: <pl:prefix><pdc><pd:sender></pdc> <message>

  # 启用后，所有 emote 指令将被重定向到 ESU，
  # 防止与其他聊天指令的混用。
  intercept-namespaces: true
  prefixed-message-modifiers:
    - message-prefix: ''
      remove-prefix: true
      permission: ''
      format: <gray><message></gray>
whisper:
  # 启用 ESU 私聊指令.
  enabled: true
  formats:
    incoming: <pl:prefix><pdc><pd:sender> <sc>➡ <tdc><message><sound:minecraft:entity.silverfish.ambient:voice:0.2:2:-7007683334921848987>
    outgoing: <pl:prefix><sc>➡ <pdc><pd:receiver> <tc><message>
    spy:
      send: <pl:prefix><pc>[<pdc><pd:sender> <sdc>➡ <tdc><pd:receiver><pc>] <tc><message>
      reply: <pl:prefix><pc>[<tdc><pd:receiver> <sc>⬅ <pdc><pd:sender><pc>] <tdc><message>
  intercept-namespaces: true
  prefixed-message-modifiers:
    - message-prefix: '>'
      remove-prefix: false
      permission: ''
      format: <green><message></green>
    - message-prefix: '*'
      remove-prefix: true
      permission: ''
      format: <gradient:#c8b3fd:#4bacc8><message></gradient>
