module-enabled: false

# Enable to notify console anti-spam messages
notify-console: true
user-data-expires-after: 20m
base-mute-duration: 10m
expire-size:
  chat-request: 10
  filtered: -1
  message-record: 30
  whisper-target: -1
  score: 10
expire-time:
  chat-request: 6m
  filtered: 4m 30s

  # Using base value(hard) plus quadratic function to check expired with a rate.
  # Default: 60 + 840 seconds(15m in total) to fully expire
  message-record:
    hard-expire-time: 1m
    quadratic-divider-offset: 60000.0
    quadratic-divider: 90000.0
    quadratic-height: 100.0
    afk-duration-multiplier:
      10m: 2.0
      5m: 1.5
  whisper-target: 4m
  score: -1

# Remove one oldest filtered record if the player sends multiple unfiltered chat message in a row.
# Set to non-positive value to disable this, and record only expires after configured time above.
consecutive-unfiltered-threshold: 3
mute-handler:
  base-mute-duration: 10m
  mute-on-filtered-size: 8
  mute-duration-multiplier:
    # Last Mute must within this interval to trigger a multiplier
    max-mute-interval: 4m
    multiplier: 2.0
    multiplier-max: 32.0
  spam-score:
    calculate-size: 6
    mute-on-average-score: 0.5625

    # Ensure the player get muted can be scored in this range after unmute
    safe-score-on-mute: 0.3
  keep-message-records: true
  keep-scores: true
spam-check:
  _default:
    notify-filtered: true

    # Efficient to "Spam" module with a fixed send rate
    fixed-request-mute:
      enabled: true
      conditions:
        - drift: 2s
          min-request-interval: 25s
          samples: 6
    frequency:
      max-messages: 8
      max-messages-per: 25s
      minimal-interval: 250ms
    illegal-characters:
      enabled: true
    letter-case:
      uniform-on-check: true
    long-message:
      max-message-size: 144
    random-characters:
      remove-random-characters-on-check: true
    similarity-check:
      block-on-disallow-count:
        8: 6
        20: 4
        48: 2
        32767: 1
      allow-rate-reduce-per-record: 0.015
      base-allow-rate: 0.8
      lowest-allow-rate: 0.55
      afk-rate-multiplier:
        10m: 1.5
        5m: 1.25
    spaces:
      remove-extra-spaces-on-check: true
      min-length: 9
      space-rate: 0.333
  chat: {}
  death: {}
  emote: {}
  whisper: {}
whisper-targets:
  max-targets: 10
  safe-targets: 2
  safe-targets-max: 6
