# Configuration of forms for Bedrock Edition

enable: true

global-permission-defaults:
  # Permission to use the form
  USE: TRUE
  # Permission to open the form through commands. USE is required for this to actually work.
  COMMAND: TRUE

forms:
  index:
    type: simple_form
    title: "Index of all GUIs"
    content: "Click on the server button of choice."
    buttons:
      - text: "Tools"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAM9aGEbGP1FoMONc4HZ6cufkLN6A8QAAmLEMRurrghX5f1G1n3ZwvUBAAMCAANtAAM2BA.png"
        actions:
          form: tools
      - text: "Toggle PVP"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAM-aGEcj6dd0TCnZCqbkfrReQNcXicAAmbEMRurrghXPKzHRdRh2QMBAAMCAANtAAM2BA.png"
        actions:
          form: pvp
      - text: "Pay others $"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAM_aGEf9AABfZjwWVa6VS2l07gjIAe_AAJsxDEbq64IV8US4rFaL76wAQADAgADbQADNgQ.png"
        actions:
          form: pay
      - text: "Toggle fly"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AANAaGEh_xDA_jtEDLfnZWu2DV3pCuwAAnPEMRurrghXbQJbmmu14X8BAAMCAANzAAM2BA.png"
        actions:
          form: fly
      - text: "Create Image Map"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AANBaGEjsfSwvItAy3mHLErVmO-N8gQAAnnEMRurrghX3r4eAAFiBehfAQADAgADbQADNgQ.png"
        actions:
          form: imgmap
      - text: "Coreprotect"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AANCaGEmGkMFmdYMZNQGXa8BfMhYQVYAAnzEMRurrghXzWKA1csGeSwBAAMCAANtAAM2BA.png"
        actions:
          form: copt
      - text: "Tp GUI"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AANEaGEmjHIXy6kpf2mmctGFJkugoKoAAn7EMRurrghXhvUl_WiAv2cBAAMCAANtAAM2BA.png"
        actions:
        - commands:
            - "player; tpgui"
      - text: "Warp GUI"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AANEaGEmjHIXy6kpf2mmctGFJkugoKoAAn7EMRurrghXhvUl_WiAv2cBAAMCAANtAAM2BA.png"
        actions:
        - commands:
            - "player; warpgui"
      - text: "Home GUI"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AANFaGEm4WXlhiqqDwxWszR_XYxRJloAAn_EMRurrghXzHdGIxnINqIBAAMCAANtAAM2BA.png"
        actions:
        - commands:
            - "player; homegui"
      - text: "Message GUI"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AANGaGEnGnSdYGrC65VxfdL5mGn__6IAAoHEMRurrghX81NktEZqReQBAAMCAANtAAM2BA.png"
        actions:
        - commands:
            - "player; msggui"
      - text: "Random telport"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AANIaGEoqQiJru__QKk1NwWqa_5yyxEAAobEMRurrghXrnk0qAtk25YBAAMCAANtAAM2BA.png"
        actions:
        - commands:
            - "player; rtp"
      - text: "Griefprevention"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AANJaGEvYKTgS0LiE4d3Gkar6HXEhMIAAo_EMRurrghXWQjNXTmT7a8BAAMCAANtAAM2BA.png"
        actions:
          form: gp
  pvp:
    type: modal_form
    title: "Switch PVP state"
    content: "8% of your total balance will be deducted when you lose an combact"
    button1:
      text: "ON"
      actions:
        - commands:
            - "player; pvp on"
    button2:
      text: "OFF"
      actions:
        - commands:
            - "player; pvp off"
  pay:
    type: custom_form
    title: "Pay system"
    components:
      - type: input
        text: "Input the player name that you wanna pay to"
        placeholder: ""
        default-text: ""
        parsers:
          - type: block-placeholders

      - type: slider
        text: "Input dollars that you wanna pay to"
        min: 1
        max: "%xconomy_balance_value%"
        step: 1
        default-value: 1

    actions:
      - commands: 
        - "player; pay %result_0% %result_1%"

  fly:
    type: modal_form
    title: "Switch Fly state"
    content: "$30/minute to fly"
    button1:
      text: "Start"
      actions:
        - commands:
            - "player; flystart"
    button2:
      text: "Stop"
      actions:
        - commands:
            - "player; flystop"

  tools:
    type: simple_form
    title: "Mixed command"
    content: "Click on the server button of choice."
    buttons:
      - text: "Open your enderchest"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAMoaGESyMNsiDw2605AmA9mN_dD48oAAkPEMRurrghXImfp_OmKZQ8BAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; endersee"
      - text: "Open a visual anvil"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAMpaGETIZiby8kL8sfzT-b1EP1I6BoAAkTEMRurrghXdcm4aSvf_dEBAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; anvil"
      - text: "Open a visual workbench"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAMqaGETTQkd5fzzgB9VIPrA-dn_na4AAkXEMRurrghX0Viqd55uKTEBAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; workbench"
      - text: "Open a visual enchanting table"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAMraGET0Np-e5ytRZ4eLYSJ3IPXedIAAkbEMRurrghXoSj1MZYyZs4BAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; enchanting"
      - text: "Open a visual grindstone"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAMsaGEUYihu6F3SgBIZu5udEJBgm7sAAkjEMRurrghXFQSBUYpnQnQBAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; grindstone"
      - text: "Open a visual loom"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAMtaGEUn9hcCGkfssSNqqpfFY2A9-cAAknEMRurrghXAXDZIzvcHkUBAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; loom"
      - text: "Open a visual smithing table"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAMuaGEVFVZ6m5yt9b9qcr6-rC6t448AAkrEMRurrghX1ZwBLfeVns8BAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; smithing"
      - text: "Open a visual cartography table"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAMvaGEVVW_9erSX43KkXxEuwuCLeG8AAkvEMRurrghXO8LtTNzM7Z8BAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; cartography"
      - text: "Open a visual stonecutter"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAMwaGEVqRlSWNXalnteYXWhHc4CKlMAAkzEMRurrghX8N2yMrgJThoBAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; stonecutter"
      - text: "Open a visual rubbish bin"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAMxaGEV_9S2dh2M4OXUBPNu0-Rx4n8AAk3EMRurrghXjkYXT1ZuxlEBAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; disposal"
      - text: "List player near you (100blocks)"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAMyaGEWcaLuRyLkqj0k5FMdqk11bEIAAk7EMRurrghXulXuursmSuUBAAMCAAN4AAM2BA.png"
        actions:
          - commands:
              - "player; near"
      - text: "Put the thing on your hand to your head"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAMzaGEWwf6Q6QVnKUBeajJq8hFQ6pYAAlDEMRurrghX5RXWjX1mze0BAAMCAAN4AAM2BA.png"
        actions:
          - commands:
              - "player; hat"
      - text: "Condense things on your hand to block"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAMzaGEWwf6Q6QVnKUBeajJq8hFQ6pYAAlDEMRurrghX5RXWjX1mze0BAAMCAAN4AAM2BA.png"
        actions:
          - commands:
              - "player; condense"
      - text: "Condense things on your hand to block"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAM0aGEXRVI7JCSc_y8ybTNW7V4PzI8AAlLEMRurrghXiiBsK6nGEOUBAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; condense"
      - text: "Sit on the ground"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAM1aGEXuA4lINB_WioOKom9LbwMdGQAAlbEMRurrghXMGMQOVAKXUcBAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; sit"
      - text: "Lay on the ground"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAM2aGEX6qsQo9ghc0gwmBwdzcRR4fUAAlrEMRurrghXSYKAMZ6E3I4BAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; lay"
      - text: "Bellyflop"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAM3aGEYUcHgcR7hf9vYSUQS-V2eEkMAAlzEMRurrghXaBo05uptEjoBAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; bellyflop"
      - text: "Spin"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAM4aGEYq_7LTC81CT09dkC-zrHUPYcAAl7EMRurrghXxj5ZGi2NrrUBAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; spin"
      - text: "Crawl on the ground"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAM5aGEY4Vk1GfzzqNFkE8CWUXOeD_MAAl_EMRurrghX6jIHAvEIBcsBAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; crawl"
      - text: "Get your head"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAM6aGEZTrVbAh-y5xk6bvhJ07W6oiYAAk3LMRvMfAlXo7YivZhTBN0BAAMCAANtAAM2BA.png"
        actions:
          - commands:
              - "player; playerhead"
      - text: "Toggle auto tools"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAM7aGEZiAQfNk-qvxm5mtzKYLuJH3YAAmDEMRurrghXlRW7f5MOml0BAAMCAAN4AAM2BA.jpg"
        actions:
          - commands:
              - "player; bt toggle"
      - text: "Toggle auto refill"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AAM8aGEZvcXaU65q9SfxFaTXgVinFG8AAmHEMRurrghXqmcujsn3VjEBAAMCAAN4AAM2BA.jpg"
        actions:
          - commands:
              - "player; rf toggle"
      - text: "Get suggest price of item in hand"
        image: "https://img.1919801.xyz/file/AgACAgUAAyEGAASJOwb3AANHaGEoDGLT25Vq13YsMRrIWoEAAS3vAAKExDEbq64IV4-H4xQWRlQHAQADAgADbQADNgQ.jpg"
        actions:
          - commands:
              - "player; quickshop suggestprice"

  imgmap:
    type: custom_form
    title: "Create an image map"
    components:
      - type: input
        text: "Map name"
        placeholder: ""
        default-text: ""

      - type: input
        text: "Photo link"
        placeholder: ""
        default-text: ""

      - type: slider
        text: "Length"
        min: 1
        max: 10
        step: 1
        default-value: 1

      - type: slider
        text: "Width"
        min: 1
        max: 10
        step: 1
        default-value: 1

    actions:
      - commands: 
        - "player; imageframe create %result_0% %result_1% %result_2% %result_3%"

  copt:
    type: custom_form
    title: "Coreprotect lookup/rollback"
    components:
      - type: dropdown
        text: "Action"
        default-option: 0
        options:
          - "lookup"
          - "rollback"
          - "restore"

      - type: input
        text: "Time (ex.1d,2h)"
        placeholder: ""
        default-text: ""
        parsers:
          - type: block-placeholders

      - type: slider
        text: "Radius(blocks)"
        min: 1
        max: 50
        step: 1
        default-value: 1

    actions:
      - commands: 
        - "player; co %result_0% t:%result_1% r:%result_2%"

  skin:
    type: custom_form
    title: "Set your skin"
    components:
      - type: input
        text: "username"
        placeholder: ""
        default-text: "kobe"
    actions:
      - commands: 
        - "player; skin set %result_0%"

  gp:
    type: simple_form
    title: "Grief Prevention"
    content: "Click on the server button of choice."
    buttons:
      - text: "Unclaim the area you stand on"
        actions:
          - commands:
              - "player; AbandonClaim"
      - text: "Toggle if explosions is allowed in your claim"
        actions:
          - commands:
              - "player; ClaimExplosions"
      - text: "List player you trusted"
        actions:
          - commands:
              - "player; TrustList"
      - text: "List player you trusted"
        actions:
          - commands:
              - "player; TrustList"
      - text: "Get out of others claim"
        actions:
          - commands:
              - "player; Trapped"
      - text: "Trust&Untrust"
        actions:
          form: trust
      - text: "Sell&Buy Claims"
        actions:
          form: claimblock

  trust:
    type: custom_form
    title: "Trust&Untrust someone"
    components:
      - type: dropdown
        text: "Action"
        default-option: 0
        options:
          - "Trust"
          - "UnTrust"
          - "AccessTrust"
          - "ContainerTrust"
          - "GivePet"

      - type: input
        text: "Type the user"
        placeholder: ""
        default-text: ""
        parsers:
          - type: block-placeholders

    actions:
      - commands: 
        - "player; %result_0% %result_1%"

  claimblock:
    type: custom_form
    title: "Buy&Sell Claim blocks"
    components:
      - type: dropdown
        text: "Action"
        default-option: 0
        options:
          - "BuyClaimBlocks"
          - "SellClaimBlocks"

      - type: slider
        text: "This is a slider"
        min: 5
        max: 10000
        step: 5
        default-value: 5

    actions:
      - commands: 
        - "player; %result_0% %result_1%"

  minigames:
    type: simple_form
    title: "Minigames"
    content: "Click on a minigame of choice."
    buttons:
      - text: "Spleef"
        image: "https://www.digminecraft.com/materials/images/snowball.png"
        actions:
          - server: "spleef"

      - text: "Hide & Seek"
        actions:
          - server: "hideseek"

  leave:
    type: modal_form
    title: "Do you want to leave the server?"
    content: "This will result in you leaving the server. Are you sure?"
    button1:
      text: "Yes"
      actions:
        - commands:
            - "console; kick %player_name%"
    button2:
      text: "No"

  broadcast:
    type: custom_form
    permission-defaults:
      USE: FALSE
      COMMAND: FALSE
    title: "Choose something to broadcast"
    components:
      - type: input
        text: "Enter a broadcast"
        parsers:
          - type: block-placeholders

    actions:
      - commands:
          - "say %result_0%"

  switch:
    type: custom_form
    title: Server Switcher
    components:
      - type: label
        text: "            Enter server details"

      - type: input
        text: Address
        placeholder: address
        parsers:
          - type: block-placeholders

      - type: input
        text: Port
        placeholder: port
        default-text: 19132
        parsers:
          - type: block-placeholders
    actions:
      - message: "Sending you to %result_1%:%result_2%"
      - type: transfer_packet
        address: "%result_1%"
        port: "%result_2%"

  example:
    type: custom_form
    title: "This is the form's title"
    components:
      - type: label
        text: "This is a label"

      - type: dropdown
        text: "This is a dropdown"
        default-option: 0
        options:
          - "option 0"
          - "option 1"
          - "option 2"

      - type: input
        text: "This is an input"
        placeholder: ""
        default-text: ""
        parsers:
          - type: block-placeholders

      - type: slider
        text: "This is a slider"
        min: 0
        max: 10
        step: 1
        default-value: 0

      - type: step_slider
        text: "This is a step slider"
        default-step: 0
        steps:
          - "step 0"
          - "step 1"
          - "step 2"

      - type: toggle
        default-value: true

    actions:
      - message: "You entered: '%result_0%' '%result_1%' '%result_2%' '%result_3%' '%result_4%' '%result_5%'"

  players:
    type: simple_form
    title: Players
    fillers:
      - type: player
        format:
          actions:
            - commands: "You selected %raw_text%"

# Don't touch this
config-version: 5
