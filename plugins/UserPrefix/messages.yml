

not-online:
- '&7玩家 &b%(player) &7并不在线。'

selected:
- '&7您选择了 &f%(name) &7作为当前显示的前缀。'

expired:
- '&7您先前使用的前缀 &f%(oldName) &7已到期。'
- '&7现在已为您重新调整为 &f%(newName) &7。'

removed:
- '&7您先前使用的前缀已被移除，现在已为您重新调整为 &f%(newName) &7。'

command-usage:
  console:
  - '&f请输入 &b/prefix <玩家ID> &f为指定玩家打开前缀GUI。'
  admin:
  - '&3&l用户前缀系统 &f帮助'
  - '&8# &f/upa list'
  - '&8- &7查看当前前缀列表。'
  - '&8# &f/upa set &b<玩家ID> &b<前缀ID>'
  - '&8- &7为玩家设定指定前缀。'
  - '&8- &7&o注意：玩家必须拥有指定前缀的权限。'
  - '&8# &f/upa reload'
  - '&8- &7重载前缀配置。'
  no-perm:
  - '&c&l抱歉！&f但您没有权限使用该指令。'

reload:
  success:
  - '&a&l重载完成！&7耗时 &f%(time)ms&7，共加载了 &b%(count) &7个前缀。'
  failed:
  - '&c&l重载出错！&7错误提示为 &8“&r%(error)&8”。'

set:
  success:
  - '&a&l设置成功！&7成功设定玩家 &b%(player) &f的前缀为 &r%(prefix) &f。'
  prefix-not-found:
  - '&c&l无法设置！&7不存在ID为 &b%(prefix) &7的前缀。'
  no-perm:
  - '&c&l无法设置！&7玩家 &b%(player) &7并没有前缀 &r%(prefix) &7的前缀。'

# 管理员使用的 “/upa list” 指令的格式
list:
  header:
  - '&3&l用户前缀系统 &f前缀列表'
  value:
  - '&8#%(weight) &f%(identifier)'
  - '&8- &7显示名 &r%(name) &7权限 &r%(permission)'
  - '&8- &7内容示例&r %(content) %(sender_name)'
