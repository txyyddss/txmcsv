debug: false

metrics: true

check-update: true

custom-storage:
  enable: false
  path: prefixes/

functions:
  auto-prefix-use: true
  on-name-prefix:
    enable: true
    order-desc: true
  chat:
    enable: false
    format: <%1$s> %2$s

gui:
  title: '&f&l我的前缀 &8| 列表'
  items:
    back:
      type: BARRIER
      name: '&c&l返回'
      lore:
      - '&f点击即可返回上一菜单'
      slot: 49
      actions:
      - '[CHAT] /menu'
  bottoms:
    next-page:
      material: ARROW
      name: 下一页
      lore:
      - '&7&o右键可前往最后一页哦'
    previous-page:
      material: ARROW
      name: 上一页
      lore:
      - '&7&o右键可前往第一页哦'

sounds:
  gui-open: BLOCK_NOTE_BLOCK_PLING:0.5:0.8
  gui-click: UI_BUTTON_CLICK
  prefix-change: ENTITY_VILLAGER_YES
  prefix-expired: ENTITY_VILLAGER_NO

default-prefix:
  name: MTN
  weight: 0
  content: '&9MTN'
  actions:
  - '[CONSOLE] say %player_name% 选择了默认前缀'
  item:
    not-using:
      material: NAME_TAG
      name: '&f默认玩家前缀 &f(点击切换)'
      lore:
      - ''
      - '&a➥ 点击切换到该前缀'
    using:
      material: NAME_TAG
      name: '&f默认玩家前缀'
      lore:
      - ''
      - '&a✔ 您正在使用该前缀'
      enchants:
        PROTECTION: 1
      flags:
      - HIDE_ENCHANTS

plugin-config:
  # 开发者查错模式
  debug: false
  # 统计数据设定
  #  该选项用于帮助开发者统计插件版本与使用情况，且绝不会影响性能与使用体验。
  #  当然，您也可以选择在这里关闭，或在plugins/bStats下的配置文件中关闭。
  metrics: true
  # 检查更新设定
  # 该选项用于插件判断是否要检查更新，若您不希望插件检查更新并提示您，可以选择关闭。
  # 检查更新为异步操作，绝不会影响性能与使用体验。
  check-update: true
  # 自定义存储位置设定
  # 可以规定到远程文件夹中去加载前缀配置
  custom-storage:
    # 是否启用自定义存储位置
    enable: false
    # 目标存储路径，必须指向一个文件夹。
    # 默认存储位置为 “插件文件夹”/prefixes
    # 支持绝对文件路径，如 "/etc/minecraft/configurations/prefixes/"
    path: prefixes/
  # 功能设定
  functions:
    # 自动使用前缀，即当玩家没有自己选择一个前缀的时候，会自动使用所拥有的的前缀中权重最高的那一个
    auto-prefix-use: true
    # 头顶与TabList前缀功能，该方法用到了玩家名计分板接口，如有冲突请关掉哦~
    on-name-prefix:
      # 是否开启本功能
      enable: true
      # 是否按降序排列，即权重越高的前缀显示在越上面；若为false则按升序排列。
      order-desc: true
    # 聊天功能设定
    # - 我不推荐使用本插件的聊天功能，而是建议使用其他的聊天插件。
    # - 本插件仅仅提供了**最基本**的格式变量支持，不包含其他任何功能。
    # - 注意聊天格式需要遵守Bukkit原格式，即不得缺失 “%1$s” 和 “%2$s” 。
    # - 本插件的聊天功能不影响其他插件对聊天事件的操作。
    chat:
      # 是否开启本功能
      enable: false
      # 聊天的格式，注意 “%1$s” 和 “%2$s” 不可缺少。
      # - %1$s -> 玩家名
      # - %2$s -> 聊天内容
      format: <%1$s> %2$s
  # 前缀GUI界面设定
  gui:
    # GUI的标题
    title: '&f&l我的前缀 &8| 列表'
    # GUI中的其他按钮物品 (若与现有物品位置冲突，将被覆盖）
    items:
      back:
        type: BARRIER
        name: '&c&l返回'
        lore:
        - '&f点击即可返回上一菜单'
        slot: 49
        actions:
        - '[CHAT] /menu'
    # GUI中的基本按钮物品
    bottoms:
      # 前往下一页的物品 (只有存在下一页时才会显示)
      next-page:
        material: ARROW
        name: 下一页
        lore:
        - '&7&o右键可前往最后一页哦'
      # 前往上一页时的物品 (只有当前页不是第一页时才会显示)
      previous-page:
        material: ARROW
        name: 上一页
        lore:
        - '&7&o右键可前往第一页哦'
  # 相关的声音，留空则不播放声音
  # 格式为 【声音名:音量:音调】 或 【声音名:音量】 或 【声音名】
  sounds:
    gui-open: BLOCK_NOTE_BLOCK_PLING:0.5:0.8
    gui-click: UI_BUTTON_CLICK
    prefix-change: ENTITY_VILLAGER_YES
    prefix-expired: ENTITY_VILLAGER_NO
  # 默认前缀配置
  default-prefix:
    # 默认前缀的显示名称，用于在消息提示中显示。
    name: 默认前缀
    # 默认前缀的描述信息。
    description:
    - '&7这是一个默认前缀'
    - '&7您可以在前缀列表中选择其他前缀'
    # 默认前缀的权重，默认为0。
    weight: 0
    # 默认前缀的内容，即用于显示的实际前缀
    content: '&r'
    # 默认前缀的切换周期，单位为毫秒。（小于0则表示不进行切换，等于0则代表所及选取）
    period: -1
    # 选择默认前缀时执行的操作
    actions:
    - '[CONSOLE] say %player_name% 选择了默认前缀'
    # 默认前缀的显示物品
    item:
      # 当未选择默认前缀时显示的物品
      not-using:
        material: NAME_TAG
        name: '&f默认玩家前缀 &f(点击切换)'
        lore:
        - ''
        - '{&f&o  }#description#{1,1}'
        - '&a➥ 点击切换到该前缀'
      # 当选择了默认前缀时显示的物品
      using:
        material: NAME_TAG
        name: '&f默认玩家前缀'
        lore:
        - ''
        - '{&f&o  }#description#{1,1}'
        - '&a✔ 您正在使用该前缀'
        enchants:
          PROTECTION: 1
        flags:
        - HIDE_ENCHANTS

