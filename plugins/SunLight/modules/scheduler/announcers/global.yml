# Interval (in seconds) between messages.
Interval: 120
# Whether messages should go in random order. Otherwise the same as defined in the config.
RandomOrder: true
# Player ranks (permission group names) that are allowed to see this announcer messages.
Ranks:
- '*'
# Announcer messages.
# Placeholders Available:
# %player_name% - Player name.
# %player_display_name% - Player display (custom) name.
# %player_prefix% - Player prefix.
# %player_suffix% - Player suffix.
# PlaceholderAPI - https://wiki.placeholderapi.com/
Texts:
  discord:
  - ' '
  - <blue><b>Join Discord Server!</b></blue>
