Warp:
  # Sets how often (in seconds) warp changes are saved to their disk files. Triggered on shutdown as well.
  # [Default is 300]
  Save-Interval: 300
  # Sets the character limit for warp IDs upon creation.
  # [Default is 20]
  Id-Max-Characters: 20
  # Sets the character limit for warp names.
  # [Default is 40]
  Name-Max-Characters: 40
  # Sets the character limit for warp descriptions.
  # [Default is 80]
  Description-Max-Characters: 80
  # Sets default icon for new warps.
  # https://nightexpressdev.com/nightcore/configuration/item-formation/
  Default-Icon:
    Material: minecraft:ender_pearl
    Lore: []
  Creation:
    # List of worlds where warp creation is disabled.
    World_Blacklist:
    - custom_world
    - world_events
  # Sets the maximum number of warps a player can create based on their permissions or rank.
  # The highest available value is always used.
  # Setting to '-1' removes the limit entirely.
  # [*] Requires Vault with a compatible permissions plugin OR LuckPerms to work.
  Amount_Per_Rank:
    # Available values: RANK, PERMISSION
    # ==================== RANK MODE ====================
    # Get value by player's permission group. All keys in 'Values' list will represent permission group names.
    # If player has none of specified groups, the 'Default_Value' setting will be used then
    #   Values:
    #     vip: 1 # -> Player must be in 'vip' permission group.
    #     gold: 2 # -> Player must be in 'gold' permission group.
    #     emerald: 3 # -> Player must be in 'emerald' permission group.
    #
    # ==================== PERMISSION MODE ====================
    # Get value by player's permissions. All keys in 'Values' list will represent postfixes for the 'Permission_Prefix' setting (see below).
    # If player has none of specified permissions, the 'Default_Value' setting will be used then
    #   Permission_Prefix: 'example.prefix.'
    #   Values:
    #     vip: 1 # -> Player must have 'example.prefix.vip' permission.
    #     gold: 2 # -> Player must have 'example.prefix.gold' permission.
    #     emerald: 3 # -> Player must have 'example.prefix.emerald' permission.
    Mode: RANK
    # Sets permission prefix for the 'PERMISSION' mode.
    Permission_Prefix: playerwarps.amount.
    Default_Value: 0.0
    Values:
      owner: -1.0
      rank1: 3.0
      rank2: 5.0
Warps:
  # Here you can create and edit warp categories.
  Categories:
    default:
      Id: default
      Name: Default
      Primary: true
      Description:
      - <gray>All other warps.</gray>
      Icon:
        Material: minecraft:compass
        Lore: []
    shops:
      Id: shops
      Name: Shops
      Primary: false
      Description:
      - <gray>Buy items from player shops.</gray>
      Icon:
        Material: minecraft:emerald
        Lore: []
    farms:
      Id: farms
      Name: Farms
      Primary: false
      Description:
      - <gray>Farm mobs and items.</gray>
      Icon:
        Material: minecraft:carrot
        Lore: []
FeaturedWarps:
  # Controls whether the 'Featued Warps' feature is enabled.
  # This feature allows player to rent 'featured slots' in the Main Warps GUI to stick their warps there.
  Enabled: true
  # Sets how often (in seconds) the featured warps cache is updated.
  # [Default is 60]
  Update-Interval: 60
  # Here you can create and edit slots used for the Featued Warps feature.
  Slots:
    left:
      Id: left
      Price:
        Currency: vault
        Amount: 1000.0
      Duration: 604800
      Slots: 1,2
    right:
      Id: right
      Price:
        Currency: vault
        Amount: 1000.0
      Duration: 604800
      Slots: 6,7
PopularWarps:
  # Controls whether the 'Popular Warps' feature is enabled.
  # This feature allows players to see top 3 (depends on slots number) most visited warps in the Main Warps GUI.
  Enabled: true
  # Sets Main Warps GUI slots where the most visited warps are displayed.
  Slots: 48,49,50
  # Sets how often (in seconds) the popular warps cache is updated.
  # [Default is 60]
  Update-Interval: 60
