General:
  # A list of player names/IP addresses that are immune to all punishments. Lower case only.
  Immunies:
  - put_here_your_staff_names
  - 127.0.0.1
  - 192.168.31.1
  # Sets default reason to use when no other reason specified in punishment commands.
  # Must be a valid reason name from the 'Reasons' section.
  # If invalid reason provided, a reason with the 'NoReason' text field from the lang config will be used.
  Default_Reason: default
  # Define here punishment reasons to use in the punishment commands.
  Reasons:
    toxic:
      Message: Toxic behavior
    default:
      Message: Violation of the rules
    advertisement:
      Message: Advertising other servers/websites
    cheating:
      Message: Cheating
    grief:
      Message: Griefing
  DisconnectInfo:
    # Text to display for player in disconnect window when kicked.
    Kick:
    - <lred><b>Server</b></lred> <dgray>»</dgray> <gray>You have been kicked!</gray>
    - ' '
    - <lred>Reason</lred> <dgray>»</dgray> <gray>%punishment_reason%</gray>
    - <lred>By</lred> <dgray>»</dgray> <gray>%punishment_punisher%</gray>
    Ban:
      # Text to display for player in disconnect window when kicked.
      Permanent:
      - <lred><b>Server</b></lred> <dgray>»</dgray> <gray>You're permanently banned!</gray>
      - ' '
      - <lred>Reason</lred> <dgray>»</dgray> <gray>%punishment_reason%</gray>
      - <lred>Date</lred> <dgray>»</dgray> <gray>%punishment_date_created%</gray>
      - <lred>By</lred> <dgray>»</dgray> <gray>%punishment_punisher%</gray>
      - ' '
      - <lgreen>Appeal at</lgreen> <dgray>»</dgray> <yellow><u>http://put_your_site.com</u></yellow>
      # Text to display for player in disconnect window when kicked.
      Temp:
      - <lred><b>Server</b></lred> <dgray>»</dgray> <gray>You're banned!</gray>
      - ' '
      - <lred>Reason</lred> <dgray>»</dgray> <gray>%punishment_reason%</gray>
      - <lred>Date</lred> <dgray>»</dgray> <gray>%punishment_date_created%</gray>
      - <lred>By</lred> <dgray>»</dgray> <gray>%punishment_punisher%</gray>
      - <lred>Unban in</lred> <dgray>»</dgray> <gray>%punishment_expires_in%</gray>
      - ' '
      - <lgreen>Appeal at</lgreen> <dgray>»</dgray> <yellow><u>http://put_your_site.com</u></yellow>
  Time_Aliases:
    PERMANENT: permanent
    SECONDS: sec,s
    MINUTES: min
    HOURS: hour,h
    DAYS: day,d
    WEEKS: week,w
    MONTHS: mon
    YEARS: year,y
AltsCheck:
  # Sets whether or not alt-account checker feature is enabled.
  Enabled: true
  # Sets whether or not plugin should cache IPs only of players that joined since the latest server or plugin reboot.
  # When disabled, plugin will cache IPs of all players in the database, which can increase memory usage.
  # [*] Keep in mind that local IPs (127.0.0.1) are never cached.
  # [Default is false]
  Cache_Joined_Players_Only: false
Punishments:
  Mute:
    # List of disabled commands for muted players.
    # All aliases for listed commands will be auto-detected and disabled too.
    Blocked_Commands:
    - broadcast
    - tell
    - me
  Rank:
    # ==================== BETA FEATURE ====================
    # Set here priority for each rank that has access to punishment commands.
    # Players with greatest ranks can not be punished by lowest ones.
    # [WARNING] This setting will not prevent IP bans!
    Priority:
      # Available values: RANK, PERMISSION
      # ==================== RANK MODE ====================
      # Get value by player's permission group. All keys in 'Values' list will represent permission group names.
      # If player has none of specified groups, the 'Default_Value' setting will be used then
      #   Values:
      #     vip: 1 # -> Player must be in 'vip' permission group.
      #     gold: 2 # -> Player must be in 'gold' permission group.
      #     emerald: 3 # -> Player must be in 'emerald' permission group.
      #
      # ==================== PERMISSION MODE ====================
      # Get value by player's permissions. All keys in 'Values' list will represent postfixes for the 'Permission_Prefix' setting (see below).
      # If player has none of specified permissions, the 'Default_Value' setting will be used then
      #   Permission_Prefix: 'example.prefix.'
      #   Values:
      #     vip: 1 # -> Player must have 'example.prefix.vip' permission.
      #     gold: 2 # -> Player must have 'example.prefix.gold' permission.
      #     emerald: 3 # -> Player must have 'example.prefix.emerald' permission.
      Mode: RANK
      # Sets permission prefix for the 'PERMISSION' mode.
      Permission_Prefix: sunlight.bans.priority.
      Default_Value: 0
      Values:
        helper: 1
        admin: 1000
        moderator: 2
    # When enabled, the 'Duration_Limit' settings will apply to all unpunish commands as well (unban, unmute, unwarn).
    # Players can not remove punishments with a duration greater than set in player's limit.
    Duration_Limit_to_Unpunish: true
    # A list of rank based duration limits for each punishment type.
    # (Vault and a compatible permissions plugins are required)
    # (Player permission groups are auto-detected)
    # This will prevent players to punish others for a time longer than you set here.
    # 'Amount' = amount of units for specified time unit. Example: 'TimeUnit' = 'DAYS' and 'Amount' = '3' equals to 3 days.
    # For the 'PERMANENT' time unit, amount value does not matter.
    # Available Time Units: PERMANENT, SECONDS, MINUTES, HOURS, DAYS, WEEKS, MONTHS, YEARS
    # Available Punishment Types: BAN, MUTE, WARN
    # The greatest duration limit will be used if player has multiple ranks with duration limits.
    # To remove limit for certain punishment type, set 'Amount' to -1.
    # To remove all limits, give 'sunlight.bans.bypass.duration.limit' permission.
    Duration_Limit:
      helper:
        WARN:
          Amount: 3
          TimeUnit: WEEKS
        MUTE:
          Amount: 1
          TimeUnit: DAYS
        BAN:
          Amount: 2
          TimeUnit: WEEKS
      moderator:
        WARN:
          Amount: 3
          TimeUnit: MONTHS
        MUTE:
          Amount: 1
          TimeUnit: WEEKS
        BAN:
          Amount: 2
          TimeUnit: MONTHS
  Warn:
    # Sets active warn limit for a player when all previous warns gets expired.
    # Example: With default value 5, when player gets 5th active warn, all previous 4 active warns becomes expired.
    # This setting is required for the 'Warns -> Auto_Commands' feature to work properly.
    # Set to '0' or '-1' for unlimit.
    Max_Amount: 5
    # Executes custom commands (from console) when player reaches certain amount of active warns.
    # Use '%player_name%' placeholder for a player name.
    Auto_Commands:
      '3':
      - mute %player_name% 15min
      '5':
      - kick %player_name%
Database:
  # Sets database type.
  # Available values: MYSQL,SQLITE
  Type: SQLITE
  # Sets how often (in minutes) plugin data of online players will be saved to the database.
  # Set to '-1' to disable.
  Auto_Save_Interval: 20
  # Sets how often (in seconds) plugin data will be fetched and loaded from the remote database.
  # Useless for SQLITE.
  # Set to '-1' to disable.
  Sync_Interval: -1
  # Custom prefix for plugin tables in database.
  Table_Prefix: sunlight_bans
  MySQL:
    # Database user name.
    Username: root
    # Database password.
    Password: root
    # Database host. Example: localhost:3306, 127.0.0.1:3306
    Host: localhost:3306
    # Name of the MySQL database where plugin will create tables.
    Database: minecraft
    # Connection options. Do not touch unless you know what you're doing.
    Options: ?allowPublicKeyRetrieval=true&useSSL=false
  SQLite:
    # File name for the SQLite database file.
    # Actually it's a path to the file, so you can use directories here.
    FileName: bans.db
  Purge:
    # Enables the purge feature.
    # Purge will remove all records from the plugin tables that are 'old' enough.
    Enabled: false
    # Sets maximal 'age' for the database records before they will be purged.
    # This option may have different behavior depends on the plugin.
    # By default it's days of inactivity for the plugin users.
    For_Period: 60
Data:
  # Sets the prefix for the database table.
  # [Case #1] Use different prefixes on different servers to isolate data from one another.
  # [Case #2] Use the same prefix across multiple servers to synchronize data between them.
  Table-Prefix: sunlight_bans
  # Sets how often (in seconds) changes to punishment data will be written to the database.
  # This applies, for example, when the punishment status is changed through the GUI.
  Save-Interval: 10
Priority:
  # Sets the priority for punishment operations executed through the console.
  # This allows console to kick, ban, mute and warn players whose rank priority is under the console's one.
  Console: 10000
  # Sets the priority for punishment operations executed by players based on their rank (aka permission group).
  # This allows players to kick, ban, mute and warn other players with smaller rank priority.
  # The greatest value is always used.
  # [*] Requires LuckPerms for the best experience. If LuckPerms is not installed, this feature will not work properly for offline players.
  Ranks:
    moderator: 50
    owner: 999
    admin: 100
Time:
  # Here you can specify custom aliases (right side only) for time units used in punishment commands. Split with comma.
  Unit-Aliases:
    seconds: sec,s
    minutes: min
    hours: hour,h
    days: day,d
    weeks: week,w
    months: mon
    years: year,y
  Duration-Limits:
    # Here you can set the maximum allowed time limit for each type of punishment, based on the rank of the player issuing the punishment.
    # If a player belongs to multiple ranks, the highest available limit will be selected for them.
    # - Limit Format: [AMOUNT] [TIME UNIT], for example: 4 DAYS
    # - Available Time Units: [SECONDS, MINUTES, HOURS, DAYS, WEEKS, MONTHS, YEARS]
    # - Available Punishment Types: [BAN, MUTE, WARN]
    # [*] To remove the limit for a specific punishment type, use -1 without a time unit.
    # [*] To remove all limits for a specific group, completely delete that group's section from the file
    # [*] To bypass all limits, give 'sunlight.bans.bypass.duration.limit' permission.
    # [*] Requires Vault with a compatible permissions plugin OR LuckPerms to work.
    Ranks:
      moderator:
        MUTE: 1 WEEKS
        BAN: 2 MONTHS
        WARN: 3 MONTHS
      helper:
        MUTE: 1 DAYS
        BAN: 2 WEEKS
        WARN: 3 WEEKS
    # Controls whether duration limit settings above should apply to pardon commands (/unban, /unmute, /unwarn).
    # This will prevent players to /unban, /unmute or /unwarn other players if other player's remaining punishment time is greater than the one available by the limit settings.
    Include-For-Pardon: true
Security:
  # List of player names/IPs/UUIDs that are immune to all punishments no matter what.
  Immunity-List:
  - 127.0.0.1
  - add_your_names_or_uuids_or_ips
  - 0.0.0.0
Disconnect-Screen:
  # Text to display in disconnect window for kicked players.
  Kick:
  - <red><b>YOU HAVE BEEN KICKED</b></red>
  - ''
  - <white>"%punishment_reason%"</white>
  # Text to display in disconnect window for permanently banned players.
  Permanent-Ban:
  - <sprite:"items":"item/barrier"><red><b> YOU ARE PERMANENTLY BANNED </b></red><sprite:"items":"item/barrier">
  - ''
  - '<white>You <gray>(<yellow>%punishment_user%</yellow>)</gray> have been permanently banned <yellow>%punishment_date_created%</yellow> with the following reason: <soft_red>"%punishment_reason%"</soft_red>.</white>'
  - ''
  - '<white>If you believe this happened by mistake, you can appeal the ban here: <green>< INSERT YOUR URL ></green></white>'
  # Text to display in disconnect window for temporary banned players.
  Temp-Ban:
  - <sprite:"items":"item/barrier"><red><b> YOU ARE TEMPORARY BANNED </b></red><sprite:"items":"item/barrier">
  - ''
  - '<white>You <gray>(<yellow>%punishment_user%</yellow>)</gray> have been temporary banned <yellow>%punishment_date_created%</yellow> with the following reason: <soft_red>"%punishment_reason%"</soft_red>.</white>'
  - ''
  - <white>You will be unbanned <gold>%punishment_date_expired%</gold><gray> (in %punishment_expires_in%)</gray></white>
  - ''
  - '<white>If you believe this happened by mistake, you can appeal the ban here: <green>< INSERT YOUR URL ></green></white>'
  # Text to display in disconnect window for players with banned IPs.
  IP-Ban:
  - <sprite:"items":"item/barrier"><red><b> YOUR IP ADDRESS IS BANNED </b></red><sprite:"items":"item/barrier">
  - ''
  - '<white>Your IP address <gray>(<yellow>%punishment_user%</yellow>)</gray> has been banned <yellow>%punishment_date_created%</yellow> with the following reason: <soft_red>"%punishment_reason%"</soft_red>.</white>'
  - ''
  - '<white>If you believe this happened by mistake, you can appeal the ban here: <green>< INSERT YOUR URL ></green></white>'
AltDetector:
  # Controls whether Alt Detector feature is enabled.
  Enabled: true
Mute:
  Block-Commands:
    # Controls whether muted players will be restricted from using certain commands.
    Enabled: true
    # Commands to block for muted players (without the '/' slash).
    List:
    - broadcast
    - me
Warn:
  # Sets the warn limit for a player.
  # When this limit is reached, all active warnings are automatically reset.
  # This setting is required for the 'Commands-For-Active-Warns' setting to function correctly.
  # [*] Set to '-1' to disable.
  Max-Amount-To-Reset: 5
  # Runs the listed commands from the console when a player reaches a certain number of warns.
  # [*] Placeholders: '%player_name%', 'Punishment (https://nightexpressdev.com/)'
  Commands-For-Active-Warns:
    '3':
    - smite %player_name%
    '5':
    - kick %player_name%
