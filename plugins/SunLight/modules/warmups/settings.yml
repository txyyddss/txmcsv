Warmup:
  # Sets how often active warmups will 'tick' to update indicator and check for completion.
  # [Asynchronous]
  # [20 ticks = 1 second]
  # [Default is 2 ticks]
  Tick_Interval: 2
  # Controls whether warmup should be cancelled if player moves.
  CancelOnMove: true
  # Controls whether warmup should be cancelled if player interacts with blocks or entities.
  CancelOnInteract: true
  # Controls whether warmup should be cancelled if player damages or get damaged by something.
  CancelOnDamage: true
  # Sets threshold (in blocks) for the player movement to determine if warmup should be cancelled.
  # [Default is 0.5 blocks]
  MovementThreshold: 0.5
  Particles:
    # Creates particles around the player during warmup.
    Enabled: true
    Left:
      Name: DUST
      Color: 0,224,0
      Size: 2.0
    Right:
      Name: DUST
      Color: 128,224,128
      Size: 2.0
    EffectX: 10.0
    EffectZ1: 0.5
    EffectZ2: 0.5
    EffectY: 1.25
Teleport:
  # The following teleport types will be handled by the Warmups module.
  # Available types: [HOME, PLAYER_WARP, WARP, SPAWN, PTP, RTP, PREVIOUS_LOCATION, DEATH_LOCATION, OTHER]
  # [*] Forced teleports (spawn on join, by admin commands, etc.) won't be handled by Warmups module.
  HandledTypes:
  - WARP
  - DEATH_BACK
  - BACK
  - SPAWN
  - PTP
  - HOME
  # Sets teleport warmup values based on player's rank or permissions.
  # Use 0 for no warmup.
  Warmups_By_Rank:
    # Available values: RANK, PERMISSION
    # ==================== RANK MODE ====================
    # Get value by player's permission group. All keys in 'Values' list will represent permission group names.
    # If player has none of specified groups, the 'Default_Value' setting will be used then
    #   Values:
    #     vip: 1 # -> Player must be in 'vip' permission group.
    #     gold: 2 # -> Player must be in 'gold' permission group.
    #     emerald: 3 # -> Player must be in 'emerald' permission group.
    #
    # ==================== PERMISSION MODE ====================
    # Get value by player's permissions. All keys in 'Values' list will represent postfixes for the 'Permission_Prefix' setting (see below).
    # If player has none of specified permissions, the 'Default_Value' setting will be used then
    #   Permission_Prefix: 'example.prefix.'
    #   Values:
    #     vip: 1 # -> Player must have 'example.prefix.vip' permission.
    #     gold: 2 # -> Player must have 'example.prefix.gold' permission.
    #     emerald: 3 # -> Player must have 'example.prefix.emerald' permission.
    Mode: RANK
    # Sets permission prefix for the 'PERMISSION' mode.
    Permission_Prefix: ''
    Default_Value: 5
    Values:
      admin: 0
      vip: 0
      slave: 3
BarIndicator:
  # Sets whether warmup boss bar indicator should be used.
  Enabled: true
  Teleport:
    # Sets warmup indicator title for teleport warmups.
    Title: <white>Teleporting in <green>%time%s</green></white>
    # Sets warmup indicator color for teleport warmups.
    Color: GREEN
    # Sets warmup indicator style for teleport warmups.
    Style: SEGMENTED_10
