EquipmentSlot:
  HAND: Hand
  OFF_HAND: Off Hand
  FEET: Feet
  LEGS: Legs
  CHEST: Chest
  HEAD: Head
  BODY: Body
  SADDLE: Saddle
GameMode:
  CREATIVE: Creative
  SURVIVAL: Survival
  ADVENTURE: Adventure
  SPECTATOR: Spectator
ExperienceType:
  POINTS: Points
  LEVELS: Levels
WeatherType:
  CLEAR: Clear
  STORM: Storm
  THUNDER: Thunder
  THUNDERSTORM: Thunderstorm
MenuType:
  ANVIL: Anvil
  CRAFTING: Crafting
  ENCHANTMENT: Enchantment
  GRINDSTONE: Grindstone
  LOOM: Loom
  SMITHING: Smithing
  CARTOGRAPHY: Cartography
  STONECUTTER: Stonecutter
  WORKBENCH: Workbench
  ENCHANTING_TABLE: Enchanting Table
  SMITHING_TABLE: Smithing Table
  CARTOGRAPHY_TABLE: Cartography Table
Command:
  Argument:
    Name:
      Slot: slot
      Enchant: enchant
      Level: level
      Target: target
      Type: type
      Time: time
      Mode: mode
      IPAddress: address
      Radius: radius
      Text: text
      Position: position
      X: x
      Y: y
      Z: z
      Reason: reason
      IPorName: name | address
      State: state
      Command: command
  Air:
    Add:
      Desc: Add air ticks.
    Set:
      Desc: Set air ticks.
      Target: '<lgray>Set <lyellow>%amount%</lyellow> air ticks for <lyellow>%player_display_name%</lyellow>. New air ticks: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
      Notify:
      - <output:"action_bar">
      - '<lgray>Your air ticks set to <lyellow>%amount%</lyellow>: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
    Remove:
      Desc: Remove air ticks.
    Give:
      Target: '<lgray>Added <lyellow>%amount%</lyellow> air ticks to <lyellow>%player_display_name%</lyellow>. New air ticks: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
      Notify:
      - <output:"action_bar">
      - '<lgray>You got <lyellow>%amount%</lyellow> air ticks: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
    Take:
      Target: '<lgray>Removed <lyellow>%amount%</lyellow> air ticks from <lyellow>%player_display_name%</lyellow>. New air ticks: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
      Notify:
      - <output:"action_bar">
      - '<lgray>You lost <lyellow>%amount%</lyellow> air ticks: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
    Root:
      Desc: Add commands.
  Broadcast:
    Desc: Broadcast a message.
  Condense:
    Desc: Condense items into blocks.
    Error:
      Nothing:
      - <sound:"entity.villager.no;0.6;1.0">
      - <lgray>Nothing to condense.</lgray>
      NotEnough: <lgray>Not enough items to convert <lred>%source%</lred> to <lred>%result%</lred>. Need at least <lred>%amount%</lred>.</lgray>
    Done: <lgray>Converted <lyellow>x%total% %source%</lyellow> to <lyellow>x%amount% %result%</lyellow>.</lgray>
  Container:
    Type:
      Desc: Open virtual %type%.
    Notify:
    - <output:"action_bar">
    - <lgray>You opened virtual <lyellow>%type%</lyellow>.</lgray>
    Target: <lgray>Opened virtual <lyellow>%type%</lyellow> for <lyellow>%player_display_name%</lyellow>.</lgray>
    Root:
      Desc: Portable Container commands.
  Disposal:
    Desc: Open a disposal menu.
    Target: <lgray>Opened disposal for <lyellow>%player_display_name%</lyellow>.</lgray>
    Notify:
    - <output:"action_bar"><sound:"block.chest.open;0.6;1.0">
    - <lgray>You opened disposal.</lgray>
  Dimension:
    Desc: Teleport to a world.
    Target: <lgray>Teleported <lyellow>%player_display_name%</lyellow> to the <lyellow>%world%</lyellow>.</lgray>
    Notify:
    - <output:"action_bar"><sound:"entity.enderman.teleport;0.6;1.0">
    - <lgray>You travelled to the <lyellow>%world%</lyellow>.</lgray>
  Enchant:
    Desc: (Dis)Enchant item in a slot.
    Error:
      NoItem: <lred>No item to enchant!</lred>
    Enchanted:
      Target:
      - <sound:"block.enchantment_table.use;0.6;1.0">
      - <lgray>Enchanted <lyellow>%item%</lyellow> with <lyellow>%name% %amount%</lyellow> in <lyellow>%player_display_name%</lyellow>'s <lyellow>%type%</lyellow> slot!</lgray>
      Notify:
      - <sound:"block.enchantment_table.use;0.6;1.0">
      - <lgray>Your <lyellow>%item%</lyellow> have been enchanted with <lyellow>%name% %amount%</lyellow>!</lgray>
    Disenchanted:
      Target:
      - <sound:"block.grindstone.use;0.6;1.0">
      - <lgray>Enchantment <lyellow>%name%</lyellow> have been removed from <lyellow>%item%</lyellow> in <lyellow>%player_display_name%</lyellow>'s <lyellow>%type%</lyellow> slot.</lgray>
      Notify:
      - <sound:"block.grindstone.use;0.6;1.0">
      - <lgray>Your <lyellow>%item%</lyellow> have been disenchanted from <lyellow>%name%</lyellow>!</lgray>
    EmptySlot: <gray>There is no item in the <white>%player_display_name%</white>'s <soft_red>%slot%</soft_red> slot.</gray>
  Experience:
    Add:
      Desc: Add xp points or levels.
      Info:
      - <noprefix>
      - ' '
      - <lgray>Added <lyellow>%amount%</lyellow> %type% to <lyellow>%player_display_name%</lyellow>.</lgray>
      - '<lgray>New level: <lyellow>%level%</lyellow></lgray>'
      - '<lgray>Total experience: <lyellow>%total%</lyellow></lgray>'
      - ' '
      Notify:
      - <noprefix>
      - ' '
      - <lgray><lyellow>%amount%</lyellow> %type% have been added to your experience!</lgray>
      - '<lgray>New level: <lyellow>%level%</lyellow></lgray>'
      - '<lgray>Total experience: <lyellow>%total%</lyellow></lgray>'
      - ' '
    Remove:
      Desc: Remove xp points or levels.
      Info:
      - <noprefix>
      - ' '
      - <lgray>Removed <lyellow>%amount%</lyellow> %type% off <lyellow>%player_display_name%</lyellow>.</lgray>
      - '<lgray>New level: <lyellow>%level%</lyellow></lgray>'
      - '<lgray>Total experience: <lyellow>%total%</lyellow></lgray>'
      - ' '
      Notify:
      - <noprefix>
      - ' '
      - <lgray><lyellow>%amount%</lyellow> %type% have been removed off your experience!</lgray>
      - '<lgray>New level: <lyellow>%level%</lyellow></lgray>'
      - '<lgray>Total experience: <lyellow>%total%</lyellow></lgray>'
      - ' '
    Set:
      Desc: Set xp points or levels.
      Info:
      - <noprefix>
      - ' '
      - <lgray>Set <lyellow>%amount%</lyellow> %type% for <lyellow>%player_display_name%</lyellow>.</lgray>
      - '<lgray>New level: <lyellow>%level%</lyellow></lgray>'
      - '<lgray>Total experience: <lyellow>%total%</lyellow></lgray>'
      - ' '
      Notify:
      - <noprefix>
      - ' '
      - <lgray><lyellow>%amount%</lyellow> %type% have been set as your experience!</lgray>
      - '<lgray>New level: <lyellow>%level%</lyellow></lgray>'
      - '<lgray>Total experience: <lyellow>%total%</lyellow></lgray>'
      - ' '
    View:
      Desc: View experience status.
    Info:
      Info:
      - <noprefix>
      - ' '
      - <lyellow><b>Experience of %player_display_name%:</b></lyellow>
      - '<lgray>Level: <lyellow>%level%</lyellow></lgray>'
      - '<lgray>Total experience: <lyellow>%total%</lyellow></lgray>'
      - '<lgray>To next level: <lyellow>%max%</lyellow></lgray>'
      - ' '
    Root:
      Desc: Experience commands.
    AddLevel:
      Desc: Add XP levels.
      Feedback: '[sound="minecraft:entity.player.levelup;0.8;1.0"]<gray>You have added <soft_green>%value%</soft_green> XP levels to <white>%player_display_name%</white> (<yellow>%oldvalue%</yellow><dark_gray> → </dark_gray><green>%newvalue%</green>)</gray>'
      Notify: '[sound="minecraft:entity.player.levelup;0.8;1.0"]<gray>You have been given <soft_green>%value%</soft_green> XP levels.</gray>'
    SetLevel:
      Desc: Set XP levels.
      Feedback: '[sound="minecraft:entity.player.levelup;0.8;1.0"]<gray>You have set <white>%player_display_name%</white>''s XP level to <soft_yellow>%value%</soft_yellow> (<yellow>%oldvalue%</yellow><dark_gray> → </dark_gray><green>%newvalue%</green>)</gray>'
      Notify: '[sound="minecraft:entity.player.levelup;0.8;1.0"]<gray>Your XP level has been set to <soft_yellow>%value%</soft_yellow>.</gray>'
    RemoveLevel:
      Desc: Remove XP levels.
      Feedback: '[sound="minecraft:entity.player.levelup;0.8;1.0"]<gray>You have took <soft_red>%value%</soft_red> XP levels from <white>%player_display_name%</white> (<yellow>%oldvalue%</yellow><dark_gray> → </dark_gray><green>%newvalue%</green>)</gray>'
      Notify: '[sound="minecraft:entity.player.levelup;0.8;1.0"]<gray>You have been taken <soft_red>%value%</soft_red> XP levels.</gray>'
    AddXP:
      Desc: Add experience points.
      Feedback: '[sound="minecraft:entity.experience_orb.pickup;0.8;1.0"]<gray>You have added <soft_green>%value%</soft_green> XP to <white>%player_display_name%</white> (<yellow>%oldvalue%</yellow><dark_gray> → </dark_gray><green>%newvalue%</green>)</gray>'
      Notify: '[sound="minecraft:entity.experience_orb.pickup;0.8;1.0"]<gray>You have been given <soft_green>%value%</soft_green> XP.</gray>'
    SetXP:
      Desc: Set experience points.
      Feedback: '[sound="minecraft:entity.experience_orb.pickup;0.8;1.0"]<gray>You have set <white>%player_display_name%</white>''s total XP to <soft_yellow>%value%</soft_yellow> (<yellow>%oldvalue%</yellow><dark_gray> → </dark_gray><green>%newvalue%</green>)</gray>'
      Notify: '[sound="minecraft:entity.experience_orb.pickup;0.8;1.0"]<gray>Your total XP has been set to <soft_yellow>%value%</soft_yellow>.</gray>'
    RemoveXP:
      Desc: Remove experience points.
      Feedback: '[sound="minecraft:entity.experience_orb.pickup;0.8;1.0"]<gray>You have took <soft_red>%value%</soft_red> XP from <white>%player_display_name%</white> (<yellow>%oldvalue%</yellow><dark_gray> → </dark_gray><green>%newvalue%</green>)</gray>'
      Notify: '[sound="minecraft:entity.experience_orb.pickup;0.8;1.0"]<gray>You have been taken <soft_red>%value%</soft_red> XP.</gray>'
  Enderchest:
    Clear:
      Desc: Clear ender chest.
      Done:
        Target:
        - <sound:"block.fire.extinguish;0.6;1.0">
        - <lgray>Cleared <lyellow>%player_display_name%</lyellow>'s ender chest!</lgray>
        Notify:
        - <sound:"block.fire.extinguish;0.6;1.0">
        - <lgray>Your ender chest has been cleared!</lgray>
    Copy:
      Desc: Copy player's ender chest.
      Done:
        Executor:
        - <sound:"item.armor.equip_leather;0.6;1.0">
        - <lgray>Copied <lyellow>%player_display_name%</lyellow>'s ender chest.</lgray>
        Others:
        - <sound:"item.armor.equip_leather;0.6;1.0">
        - <lgray>Copied <lyellow>%source%</lyellow>'s ender chest content to <lyellow>%target%</lyellow>'s ender chest.</lgray>
    Fill:
      Desc: Fill ender chest with specified item.
      Done:
        Executor:
        - <sound:"entity.item.pickup;0.6;1.0">
        - <lgray>Filled <lyellow>%player_display_name%</lyellow>'s ender chest with <lyellow>%item%</lyellow>.</lgray>
    Open:
      Desc: Open ender chest.
      Done:
        Executor:
        - <sound:"block.ender_chest.open;0.6;1.0">
        - <lgray>Opened <lyellow>%player_display_name%</lyellow>'s ender chest.</lgray>
      Notify: '[sound="minecraft:block.ender_chest.open;0.8;1.0"]<gray>You have opened your <soft_purple>Ender Chest.</soft_purple></gray>'
      Targetted: '[sound="minecraft:block.ender_chest.open;0.8;1.0"]<gray>You have opened <white>%player_display_name%</white>''s <soft_purple>Ender Chest.</soft_purple></gray>'
    Repair:
      Desc: Repair all ender chest items.
      Notify:
      - <sound:"block.anvil.use;0.6;1.0">
      - <lgray>Repaired all ender chest items!</lgray>
      Target:
      - <sound:"block.anvil.use;0.6;1.0">
      - <lgray>Repaired all items in <lyellow>%player_display_name%</lyellow>'s ender chest!</lgray>
    Hub:
      Desc: Ender Chest commands.
  Hat:
    Desc: Put item in head.
    Done:
    - <sound:"item.armor.equip_leather;0.6;1.0">
    - <lgray>Enjoy your new hat!</lgray>
    EmptyHand: '[sound="minecraft:entity.villager.no;0.8;1.0"]<gray>You must hold an item in your hand to equip it!</gray>'
  Fly:
    Desc: Toggle fly.
    Target: <lgray>Set flying for <lyellow>%player_display_name%</lyellow> to <lyellow>%state%</lyellow>.</lgray>
    Notify: <lgray>Flying <lyellow>%state%</lyellow>.</lgray>
    Root:
      Desc: Fly commands.
    Toggle:
      Desc: Toggle fly.
    'On':
      Desc: Enable fly.
    'Off':
      Desc: Disable fly.
  FlySpeed:
    Desc: Change fly speed.
    Done:
      Notify: <lgray>Your fly speed has been set to <lyellow>%amount%</lyellow>.</lgray>
      Target: <lgray>Set fly speed to <lyellow>%amount%</lyellow> for <lyellow>%player_display_name%</lyellow>.</lgray>
  Fire:
    Set:
      Desc: Set fire ticks.
      Info: '<lgray>Set <lyellow>%player_display_name%</lyellow>''s fire ticks to <lyellow>%amount%</lyellow>, aka ignited for: <lyellow>%time%</lyellow>s.</lgray>'
      Target: <lgray>You have been ignited for <lyellow>%time%</lyellow>s.</lgray>
    Reset:
      Desc: Reset fire ticks.
      Info:
      - <sound:"block.fire.extinguish;0.6;1.0">
      - <lgray>Reset <lyellow>%player_display_name%</lyellow>'s fire ticks value, aka extinguished.</lgray>
      Target:
      - <sound:"block.fire.extinguish;0.6;1.0">
      - <lgray>You have been extinguished.</lgray>
  Food:
    Add:
      Desc: Add food points.
    Set:
      Desc: Set food level.
      Target: <lgray>Set <lyellow>%player_display_name%</lyellow>'s food level to <lyellow>%amount%</lyellow>.</lgray>
      Notify: <lgray>Your food level has been set to <lyellow>%amount%</lyellow>.</lgray>
    Remove:
      Desc: Remove food points.
    Restore:
      Desc: Restore food level.
      Notify:
      - <sound:"entity.generic.eat;0.6;1.0">
      - <lgray>You food level has been restored!</lgray>
      Info:
      - <sound:"entity.generic.eat;0.6;1.0">
      - <lgray>Restored <lyellow>%player_display_name%</lyellow>'s food level!</lgray>
    Give:
      Target: '<lgray>Added <lyellow>%amount%</lyellow> food points to <lyellow>%player_display_name%</lyellow>. New food level: <lyellow>%current%</lyellow>.</lgray>'
      Notify: <lgray>Your food level has been increased by <lyellow>%amount%</lyellow>.</lgray>
    Take:
      Target: '<lgray>Removed <lyellow>%amount%</lyellow> food points from <lyellow>%player_display_name%</lyellow>. New food level: <lyellow>%current%</lyellow>.</lgray>'
      Notify: <lgray>Your food level has been decreased by <lyellow>%amount%</lyellow>.</lgray>
    Root:
      Desc: Food level commands.
  GameMode:
    Type:
      Desc: Set gamemode to %type%.
    Notify: <lgray>Your game mode has been set to <lyellow>%type%</lyellow>.</lgray>
    Target: <lgray>Set <lyellow>%type%</lyellow> game mode for <lyellow>%player_display_name%</lyellow>.</lgray>
    Root:
      Desc: Game Mode commands.
  Health:
    Add:
      Desc: Add health points.
      Target: '<lgray>Added <lyellow>%amount%</lyellow> health to <lyellow>%player_display_name%</lyellow>. New health: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
      Notify:
      - <output:"action_bar">
      - '<lgray>You got <lyellow>%amount%</lyellow> health: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
    Set:
      Desc: Set health points.
      Target: '<lgray>Set <lyellow>%amount%</lyellow> health for <lyellow>%player_display_name%</lyellow>. New health: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
      Notify:
      - <output:"action_bar">
      - <lgray>Your health has been set to <lyellow>%amount%</lyellow>/<lyellow>%max%</lyellow>.</lgray>
    Remove:
      Desc: Remove health points.
      Target: '<lgray>Removed <lyellow>%amount%</lyellow> health from <lyellow>%player_display_name%</lyellow>. New health: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
      Notify:
      - <output:"action_bar">
      - '<lgray>You lost <lyellow>%amount%</lyellow> health: <lyellow>%current%</lyellow>/<lyellow>%max%</lyellow>.</lgray>'
    Restore:
      Desc: Restore health.
      Notfiy: <lgray>You have been healed!</lgray>
      Info: <lgray>Player <lyellow>%player_display_name%</lyellow> has been healed.</lgray>
    Root:
      Desc: Health commands.
    Revive:
      Feedback: '[sound="minecraft:item.totem.use;0.8;1.0"]<gray>You have been revived.</gray>'
      Notify: '[sound="minecraft:item.totem.use;0.8;1.0"]<gray>You have revived <white>%player_display_name%</white>.</gray>'
    TargetDead:
      Feedback: '[sound="minecraft:entity.villager.no;0.8;1.0"]<gray><white>%player_display_name%</white>''s health can not modified, because they are dead.</gray>'
      Notify: '[sound="minecraft:entity.villager.no;0.8;1.0"]<gray>You can''t change your health while you are dead.</gray>'
  Ignore:
    Add:
      Desc: Add player to the blacklist.
      Done:
      - <noprefix>
      - <lyellow><b>Player Blocked!</b></lyellow>
      - <lgray>Player <lyellow>%player_display_name%</lyellow> added to the blacklist.</lgray>
      - <lgray>You can change settings or unblock them using <lyellow>/ignorelist</lyellow></lgray>
      Error:
        AlreadyIn: <lgray>Player is already blocked.</lgray>
    List:
      Desc: Open player blacklist.
    Remove:
      Desc: Remove player from the blacklist.
      Done: <lgray>Player <lyellow>%player_name%</lyellow> has been unblocked.</lgray>
      Error:
        NotIn: <lgray>Player is not blocked.</lgray>
  Inventory:
    Clear:
      Desc: Clear inventory.
      Done:
        Target:
        - <sound:"block.fire.extinguish;0.6;1.0">
        - <lgray>Cleared <lyellow>%player_display_name%</lyellow>'s inventory!</lgray>
        Notify:
        - <sound:"block.fire.extinguish;0.6;1.0">
        - <lgray>Your inventory has been cleared!</lgray>
    Copy:
      Desc: Copy player's inventory.
      Done:
        Notify:
        - <sound:"item.armor.equip_leather;0.6;1.0">
        - <lgray>Copied <lyellow>%player_display_name%</lyellow>'s inventory.</lgray>
        Target:
        - <sound:"item.armor.equip_leather;0.6;1.0">
        - <lgray>Copied <lyellow>%source%</lyellow>'s inventory to <lyellow>%target%</lyellow>'s inventory.</lgray>
    Fill:
      Desc: Fill inventory with specified items.
      Done:
      - <sound:"entity.item.pickup;0.6;1.0">
      - <lgray>Filled <lyellow>%player_display_name%</lyellow>'s inventory with <lyellow>%item%</lyellow>.</lgray>
    Open:
      Desc: Open player's inventory.
      Done:
      - <sound:"block.chest.open;0.6;1.0">
      - <lgray>Opened <lyellow>%player_display_name%</lyellow>'s inventory.</lgray>
    Repair:
      Desc: Repair all inventory items.
      Notify:
      - <sound:"block.anvil.use;0.6;1.0">
      - <lgray>Repaired all inventory items!</lgray>
      Target:
      - <sound:"block.anvil.use;0.6;1.0">
      - <lgray>Repaired all items in <lyellow>%player_display_name%</lyellow>'s inventory!</lgray>
    Root:
      Desc: Inventory management commands.
  Item:
    Amount:
      Desc: Change item amount.
      Done:
      - <sound:"entity.item.pickup;0.6;1.0">
      - <lgray>Set <lyellow>%item%</lyellow> stack amount to x<lyellow>%amount%</lyellow>.</lgray>
    Damage:
      Desc: Change item's damage.
      Done:
      - <sound:"block.anvil.use;0.6;1.0">
      - <lgray>Set <lyellow>%item%</lyellow> damage to <lyellow>%amount%</lyellow>.</lgray>
    Enchant:
      Desc: (Dis)Enchant an item in hand.
      Error:
        NotCompatible:
        - <sound:"entity.villager.no;0.6;1.0">
        - <lgray><lred>%item%</lred> can not be enchanted with <lred>%name%</lred>!</lgray>
        Overpowered:
        - <sound:"entity.villager.no;0.6;1.0">
        - <lgray><lred>%name%</lred>'s max. level is <lred>%level%</lred>!</lgray>
      Done:
        Enchanted:
        - <sound:"block.enchantment_table.use;0.6;1.0">
        - <lgray><lyellow>%item%</lyellow> enchanted with <lyellow>%name% %level%</lyellow>!</lgray>
        Disenchanted:
        - <sound:"block.enchantment_table.use;0.6;1.0">
        - <lgray>Enchantment <lyellow>%name%</lyellow> have been removed from <lyellow>%item%</lyellow>!</lgray>
    Get:
      Desc: Get specified item stack.
      Done:
      - <sound:"entity.item.pickup;0.6;1.0">
      - <lgray>You got <lyellow>x%amount% %type%</lyellow>!</lgray>
    Give:
      Desc: Give specified item stack to a player.
      Done:
      - <sound:"entity.item.pickup;0.6;1.0">
      - <lgray>Added <lyellow>x%amount% %type%</lyellow> to <lyellow>%player_display_name%</lyellow>!</lgray>
      Notify:
      - <sound:"entity.item.pickup;0.6;1.0">
      - <lgray><lyellow>x%amount% %type%</lyellow> have been added to your inventory!</lgray>
    Take:
      Desc: Take item off a player.
      Done:
      - <sound:"entity.glow_item_frame.remove_item;0.6;1.0">
      - <lgray>Removed <lyellow>x%amount%</lyellow> of <lyellow>%type%</lyellow> from <lyellow>%player_display_name%</lyellow>!</lgray>
      Error:
        NotEnough:
        - <sound:"entity.villager.no;0.6;1.0">
        - <lgray>Could not take item(s). Player don't have enough <lred>%type%</lred> (<white>%amount%</white>/<white>%total%</white>)!</lgray>
      Notify:
      - <sound:"entity.glow_item_frame.remove_item;0.6;1.0">
      - <lgray><lyellow>x%amount%</lyellow> of <lyellow>%type%</lyellow> has been taken from your inventory!</lgray>
    Lore:
      Add:
        Desc: Add a lore.
        Done:
        - <sound:"block.anvil.use;0.6;1.0">
        - <lgray>Lore added!</lgray>
      Remove:
        Desc: Remove a lore.
