Warps:
  WarpType:
    SERVER: Server
    PLAYER: Player
  SortType:
    WARP_NAME: Warp Name
    WARP_ID: Warp Id
    WARP_TYPE: Warp Type
    VISIT_COST: Visit Cost
  Command:
    Warps:
      Delete:
        Desc: Delete a warp.
      Create:
        Desc: Create a new warp.
      Teleport:
        Desc: Teleport to a warp.
        Others: <lgray>Teleported <lyellow>%player_display_name%</lyellow> to <lyellow>%warp_name%</lyellow> warp.</lgray>
      ResetCooldown:
        Desc: Reset warp cooldown.
        Done: <lgray>Reset <lyellow>%warp_name%</lyellow> warp cooldown for <lyellow>%player_name%</lyellow>.</lgray>
        Notify: <lgray>Your <lyellow>%warp_name%</lyellow> warp cooldown have been reset!</lgray>
      SetCooldown:
        Desc: Set warp cooldown.
        Done: <lgray>Set <lyellow>%warp_name%</lyellow> warp cooldown on <lyellow>%amount%</lyellow> for <lyellow>%player_name%</lyellow>.</lgray>
        Notify: <lgray>Your <lyellow>%warp_name%</lyellow> warp cooldown have been set to <lyellow>%amount%</lyellow>!</lgray>
      List:
        Desc: Open Warps GUI.
        Others: <lgray>Opened Warp GUI for <lyellow>%player_display_name%</lyellow>.</lgray>
      Root:
        Desc: Warps commands.
      Update:
        Desc: Update warp location.
      Edit:
        Desc: Edit a warp.
      Jump:
        Desc: Jump to a warp.
    Warp:
      Desc: Go to the %warp_name% warp.
    Syntax:
      InvalidWarp: <gray><red>%input%</red> is not a valid warp!</gray>
  Delete:
    Done:
    - <output:"titles:20:60:20"><sound:"block.glass.break;0.6;1.0">
    - <lyellow><b>Warp Removed!</b></lyellow>
    - <lgray>You removed <lyellow>%warp_name%</lyellow> warp.</lgray>
    Notify: '[sound="minecraft:block.glass.break;0.8;1.0"]<gray>You have removed <orange>%warp_name%</orange> warp.</gray>'
  Warp:
    Creation:
      New:
      - <output:"titles:20:60:20"><sound:"block.anvil.place;0.6;1.0">
      - <lgreen><b>Warp Created!</b></lgreen>
      - '<lgray>Teleport: <lgreen>/warp %warp_id%</lgreen> | Edit in: <lgreen>/warplist</lgreen></lgray>'
      Relocate:
      - <output:"titles:20:60:20"><sound:"block.anvil.place;0.6;1.0">
      - <lgreen><b>Warp Relocated!</b></lgreen>
      - <lgray>You moved out <lgreen>%warp_name%</lgreen> warp.</lgray>
      Error:
        Limit:
        - <output:"titles:20:60:20"><sound:"entity.villager.no;0.6;1.0">
        - <lred><b>Limit Reached!</b></lred>
        - <lgray>You can't create more warps!</lgray>
        World:
        - <output:"titles:20:60:20"><sound:"entity.villager.no;0.6;1.0">
        - <lred><b>Forbidden World!</b></lred>
        - <lgray>You can't create warps in this world!</lgray>
        Exists:
        - <output:"titles:20:60:20"><sound:"entity.villager.no;0.6;1.0">
        - <lred><b>Already Exists!</b></lred>
        - <lgray>Warp with such name already exists.</lgray>
        Unsafe:
        - <output:"titles:20:60:20"><sound:"entity.villager.no;0.6;1.0">
        - <lred><b>Unsafe Location!</b></lred>
        - <lgray>Please, choose another place.</lgray>
    Teleport:
      Done:
      - <output:"titles:20:60:20"><sound:"entity.enderman.teleport;0.6;1.0">
      - <lyellow><b>%warp_name%</b></lyellow>
      - <lgray>%warp_description%</lgray>
      Error:
        NotEnoughFunds:
        - <output:"titles:20:60:20"><sound:"entity.villager.no;0.6;1.0">
        - <lred><b>Not Enough Funds!</b></lred>
        - <lgray>You need <lred>$%warp_visit_cost%</lred> to visit this warp!</lgray>
        NoPermission:
        - <output:"titles:20:60:20"><sound:"entity.villager.no;0.6;1.0">
        - <lred><b>No Permission!</b></lred>
        - <lgray>You don't have permission for <lred>%warp_name%</lred> warp!</lgray>
        Cooldown:
        - <output:"titles:20:60:20"><sound:"entity.villager.no;0.6;1.0">
        - <lred><b>Cooldown!</b></lred>
        - <lgray>You can visit <lred>%warp_name%</lred> again in <lred>%cooldown%</lred></lgray>
        Unreachable:
        - <output:"titles:20:60:20"><sound:"entity.villager.no;0.6;1.0">
        - <lred><b>Unreachable Warp!</b></lred>
        - <lgray><lred>%warp_name%</lred> located in an unavailable world.</lgray>
        Time:
        - <output:"titles:20:60:20"><sound:"entity.villager.no;0.6;1.0">
        - <lred><b>Wrong Time!</b></lred>
        - <lgray><lred>%warp_name%</lred> is not available for visits now.</lgray>
    Jump:
      Notify:
      - '[type="title",sound="minecraft:entity.enderman.teleport;0.8;1.0",title_times="20:60:20"]'
      - <orange><b>%warp_name%</b></orange>
      - <gray>%warp_description%</gray>
      Feedback: <gray>You have teleported <orange>%player_display_name%</orange> to <white>%warp_name%</white> warp.</gray>
  Error:
    Command:
      Argument:
        InvalidWarp: <lgray><lred>%value%</lred> is not a valid warp!</lgray>
    NoWarpPermission: '[sound="minecraft:entity.villager.no;0.8;1.0"]<gray>You don''t have access to the <red>%warp_name%</red> warp.</gray>'
    InactiveWarp: '[sound="minecraft:entity.villager.no;0.8;1.0"]<gray><red>%warp_name%</red> is currently unavailable.</gray>'
  Editor:
    Enter:
      CostMoney: <lgray>Enter <lgreen>[Cost]</lgreen></lgray>
      Command: <lgray>Enter <lgreen>[Command Name]</lgreen></lgray>
      Times: <lgray>Enter <lgreen>[Times] <lgray>></lgray> 10:00 14:00</lgreen></lgray>
      Cooldown: <lgray>Enter <lgreen>[Cooldown]</lgreen></lgray>
      Name: <lgray>Enter <lgreen>[Display Name]</lgreen></lgray>
      Description: <lgray>Enter <lgreen>[Description]</lgreen></lgray>
  Creation:
    InvalidId: '[sound="minecraft:entity.villager.no;0.8;1.0"]<gray>Warp ID must be alphabetical!</gray>'
    AlreadyExists: '[sound="minecraft:entity.villager.no;0.8;1.0"]<gray>Warp already exists!</gray>'
    Notfy: '[sound="minecraft:block.anvil.place;0.8;1.0"]<gray>You have created <orange>%warp_name%</orange> warp.</gray>'
  Update:
    Notify: '[sound="minecraft:block.anvil.place;0.8;1.0"]<gray>You have updated <orange>%warp_name%</orange> warp''s location.</gray>'
  Browser:
    Empty: <gray>There are no warps available.</gray>
    Feedback: <gray>You have opened Warps GUI for <orange>%player_display_name%</orange>.</gray>
  Dialog:
    WarpName:
      Title: <yellow><b>WARP</b></yellow><dark_gray> » </dark_gray><white>Name</white>
      Body:
        Contents:
        - Please enter a name for the warp.
        - ''
        - You can click <click:open_url:"https://nightexpressdev.com/nightcore/configuration/text-formation/"><yellow><b>HERE</b></yellow></click> to see all available formatting tags and color codes.
        Width: 400
      Input:
        Name: <sprite:"items":"item/name_tag"> Name
    WarpDescription:
      Title: <yellow><b>WARP</b></yellow><dark_gray> » </dark_gray><white>Description</white>
      Body:
        Contents:
        - Please enter a description for the warp.
        - ''
        - You can click <click:open_url:"https://nightexpressdev.com/nightcore/configuration/text-formation/"><yellow><b>HERE</b></yellow></click> to see all available formatting tags and color codes.
        Width: 400
      Input:
        Name: <sprite:"items":"item/writable_book"> Description
    WarpCommand:
      Title: <yellow><b>WARP</b></yellow><dark_gray> » </dark_gray><white>Command</white>
      Body:
        Contents:
        - Enter a <yellow>command</yellow> for quick access to this warp.
        - ''
        - This command allows players to quickly teleport to this warp without providing additional arguments.
        - ''
        - To apply these changes, we <red>strongly recommend</red> restarting the server.
        - However, you may check the <orange>'Rebuild Commands'</orange> box to apply changes 'live', though some minor <orange>side effects</orange> may occur.
        Width: 400
      Input:
        Enabled: Enabled
        Name: <sprite:"items":"item/command_block_minecart"> Command
        Rebuild: Rebuild Commands
    WarpSlots:
      Title: <yellow><b>WARP</b></yellow><dark_gray> » </dark_gray><white>Slots</white>
      Body:
        Contents:
        - Specify the <yellow>slots</yellow> and <yellow>page number</yellow> where this warp will be displayed in the GUI.
        - ''
        - Slot numbers start <orange>at 0</orange> and should be separated by commas <gray>(e.g., 1, 2, 10, 11)</gray>.
        - ''
        - The <yellow>total number</yellow> of GUI pages is determined by the <yellow>highest</yellow> page number assigned to any warp.
        - ''
        - You can set the page number to <red>0</red> to hide this warp from the GUI.
        Width: 400
      Input:
        Page: <sprite:"items":"item/paper"> Page
        Name: <sprite:"items":"item/item_frame"> Slots
  UI:
    WarpsMenu:
      WarpDefault:
        Name: '%warp_name%'
        Lore:
        - '%warp_description%'
        - '%empty-if-above%'
        - <gold>→ <u>Click to teleport</u></gold>
      WarpModerate:
