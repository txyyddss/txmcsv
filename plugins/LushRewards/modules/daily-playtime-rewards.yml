# Daily Playtime Rewards: Hourly playtime goals that reset daily
type: playtime-rewards
enabled: true

# How often (in days) to reset (0 to disable)
reset-playtime-at: 1
# Time in minutes between checking whether any online players need to receive rewards (-1 to disable)
refresh-time: 1
# Whether notifications should be sent when rewards are claimable
enable-notifications: true

goals:
  - play-minutes: 10 # 10 minutes
    display-item:
      lore:
        - "&#bdbebfRewards:"
        - "&#bdbebf- $100"
    rewards:
      - type: command
        commands:
          - "money give %player% 100"
  - play-minutes: 20 # 20 minutes
    display-item:
      amount: 2
      lore:
        - "&#bdbebfRewards:"
        - "&#bdbebf- $250"
    rewards:
      - type: command
        commands:
          - "money give %player% 250"
  - play-minutes: 30 # 30 minutes
    display-item:
      amount: 3
      lore:
        - "&#bdbebfRewards:"
        - "&#bdbebf- $400"
    rewards:
      - type: command
        commands:
          - "money give %player% 400"
  - play-minutes: 40 # 40 minutes
    display-item:
      amount: 4
      lore:
        - "&#bdbebfRewards:"
        - "&#bdbebf- $500"
    rewards:
      - type: command
        commands:
          - "money give %player% 500"
  - play-minutes: 50 # 50 minutes
    display-item:
      amount: 6
      lore:
        - "&#bdbebfRewards:"
        - "&#bdbebf- $650"
    rewards:
      - type: command
        commands:
          - "money give %player% 650"
  - play-minutes: 60 # 60 minutes (1 Hour)
    display-item:
      amount: 8
      lore:
        - "&#bdbebfRewards:"
        - "&#bdbebf- $700"
    rewards:
      - type: command
        commands:
          - "money give %player% 700"
  - play-minutes: 120 # 2 Hours
    display-item:
      amount: 10
      lore:
        - "&#bdbebfRewards:"
        - "&#bdbebf- $1000"
    rewards:
      - type: command
        commands:
          - "money give %player% 1000"

gui:
  title: "    &#529bf2&lDaily Playtime Rewards"
  scroll-type: FIXED
  # Available templates: DEFAULT, COMPACT
  # Read https://docs.lushplugins.org/lush-rewards/configuring/gui-templates#custom-templates for more info on
  # creating and using templates
  template: "BORDERED_LARGE"
  item-templates:
    default-reward:
      material: clock
      display-name: "&#f5e389%minutes% Minutes"
    redeemable-reward:
      material: clock
      display-name: "&#f5e389%minutes% Minutes - Redeemable"
    collected-reward:
      material: clock
      display-name: "&#f5e389%minutes% Minutes - Collected"
    'P':
      material: player_head
      display-name: "&#A5B8FE&lProfile:"
      skull-texture: mirror
      lore:
        - "&#c4f8ffNext Reward in: &f%lushrewards_daily-playtime-rewards_time_until_next_reward%"
