plugin-language: default
check-update: true
doll-identifier: '-'
preserved-doll-name:
- ''
adjustable-max-player: true
server-max-doll-spawn: -1
broadcast-doll-death: true
broadcast-doll-join: false
broadcast-doll-disconnect: true
display-doll-when-ping: false
op-can-see-hidden-doll: true
doll-permission:
- ''
doll-metadata:
- ''
chat-when-join-interval: 10
chat-when-join:
- /register %name%123 %name%123 (becomes /register {dollname}123 {dollname}123)
- /login %name%123 (becomes /login {dollname}123)
convert-player: false
broadcast-convert-shutdown: true
force-proxy-ip: false
proxy-ip: 127.0.0.1
proxy-port: 25565
auto-join-delay: 1
server-mod: ''
