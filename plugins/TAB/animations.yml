    - "&8✧ &6余额: &e%tne_balance_formatted%"
    - "&8✧ &6余额: &e%tne_balance_formatted%"
    - "&8✧ &6余额: &e%tne_balance_formatted%"
    - "&8✧ &6排名: &e%tne_toppos_MTB%"
    - "&8✦ &6排名: &f%tne_toppos_MTB%"
    - "&8✧ &6排名: &e%tne_toppos_MTB%"
    - "&8✦ &6排名: &f%tne_toppos_MTB%"
    - "&8✧ &6排名: &e%tne_toppos_MTB%"
