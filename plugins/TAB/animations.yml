    - "<gradient:#B0DEFF:#D0F6FF><bold>MT Network</bold></gradient>"
    - "<gradient:#C8E8FF:#E0FAFF><bold>MT Network</bold></gradient>"
    - "<gradient:#E0F0FF:#F0FDFF><bold>MT Network</bold></gradient>"
    - "<gradient:#FFFFFF:#FFFFFF><bold>MT Network</bold></gradient>"
    - "<gradient:#E0F0FF:#F0FDFF><bold>MT Network</bold></gradient>"
    - "<gradient:#C8E8FF:#E0FAFF><bold>MT Network</bold></gradient>"
    - "<gradient:#B0DEFF:#D0F6FF><bold>MT Network</bold></gradient>"
    - "<gradient:#9BD6FF:#BFF2FF><bold>MT Network</bold></gradient>"
    - "<gradient:#84CEFF:#B0EDFF><bold>MT Network</bold></gradient>"
