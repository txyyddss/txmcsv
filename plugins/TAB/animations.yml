# --- WorldGuard: Smooth color fade rotation ---
worldguard:
  change-interval: 2000
  texts:
    - "&8◈ &f区域: <gradient:#55FF55:#00AA00>%worldguard_region_name%</gradient>"
    - "&8◈ &f区域: <gradient:#00AA00:#55FF55>%worldguard_region_name%</gradient>"
    - "&8◆ &f主人: <gradient:#FFFF55:#FFAA00>%worldguard_region_owner%</gradient>"
    - "&8◆ &f主人: <gradient:#FFAA00:#FFFF55>%worldguard_region_owner%</gradient>"
    - "&8◇ &f成员: <gradient:#55FFFF:#00AAAA>%worldguard_region_members%</gradient>"
    - "&8◇ &f成员: <gradient:#00AAAA:#55FFFF>%worldguard_region_members%</gradient>"