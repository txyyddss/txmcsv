# --- Server Status: Color-coded pulse indicators ---
server_status:
  change-interval: 800
  texts:
    # TPS display with pulsing dot
    - "&8● &7TPS: &a%tps%"
    - "&8◉ &7TPS: &a%tps%"
    - "&8● &7TPS: &a%tps%"
    - "&8◉ &7TPS: &a%tps%"
    - "&8● &7TPS: &a%tps%"
    # MSPT display
    - "&8● &7MSPT: &e%mspt%"
    - "&8◉ &7MSPT: &e%mspt%"
    - "&8● &7MSPT: &e%mspt%"
    - "&8◉ &7MSPT: &e%mspt%"
    - "&8● &7MSPT: &e%mspt%"
    # RAM display
    - "&8● &7RAM: &b%memory-used%&8/&3%memory-max%"
    - "&8◉ &7RAM: &b%memory-used%&8/&3%memory-max%"
    - "&8● &7RAM: &b%memory-used%&8/&3%memory-max%"
    - "&8◉ &7RAM: &b%memory-used%&8/&3%memory-max%"
    - "&8● &7RAM: &b%memory-used%&8/&3%memory-max%"

