# https://flectone.net/pulse/docs/integration
enable: true
avatar_api_url: "https://mc-heads.net/avatar/<skin>/8.png"
body_api_url: "https://mc-heads.net/player/<skin>/16.png"
# https://flectone.net/pulse/docs/integration/advancedban
advancedban:
  enable: false
  disable_flectonepulse_ban: true
  disable_flectonepulse_mute: true
  disable_flectonepulse_warn: true
  disable_flectonepulse_kick: true
# https://flectone.net/pulse/docs/integration/cmi
cmi:
  enable: false
  disable_flectonepulse_ban: true
  disable_flectonepulse_mute: true
  disable_flectonepulse_warn: true
  disable_flectonepulse_kick: true
# https://flectone.net/pulse/docs/integration/deepl
deepl:
  enable: false
  auth_key: ""
# https://flectone.net/pulse/docs/integration/discord
discord:
  enable: false
  ignore_all_bots: true
  ignore_all_webhooks: true
  token: ""
  custom_command:
    ping:
      need_player: true
      aliases:
      - "!ping"
  presence:
    enable: true
    status: "ONLINE"
    activity:
      enable: true
      type: "PLAYING"
      name: "FlectonePulse"
      url: "https://flectone.net/pulse/"
  channel_info:
    enable: false
    ticker:
      enable: true
      period: 1200
  message_channel:
    INTEGRATION_DISCORD:
    - "123456"
    MESSAGE_CHAT_GLOBAL:
    - "123456"
  destination:
    type: "CHAT"
  sound:
    enable: false
# https://flectone.net/pulse/docs/integration/floodgate
floodgate:
  enable: true
# https://flectone.net/pulse/docs/integration/geyser
geyser:
  enable: true
# https://flectone.net/pulse/docs/integration/interactivechat
interactivechat:
  enable: false
# https://flectone.net/pulse/docs/integration/itemsadder
itemsadder:
  enable: false
# https://flectone.net/pulse/docs/integration/libertybans
libertybans:
  enable: false
  disable_flectonepulse_ban: true
  disable_flectonepulse_mute: true
  disable_flectonepulse_warn: true
  disable_flectonepulse_kick: true
# https://flectone.net/pulse/docs/integration/litebans
litebans:
  enable: false
  disable_flectonepulse_ban: true
  disable_flectonepulse_mute: true
  disable_flectonepulse_warn: true
  disable_flectonepulse_kick: true
# https://flectone.net/pulse/docs/integration/luckperms
luckperms:
  enable: true
  always_have_true: false
  tab_sort: true
# https://flectone.net/pulse/docs/integration/maintenance
maintenance:
  enable: true
  disable_flectonepulse_maintenance: true
# https://flectone.net/pulse/docs/integration/minimotd
minimotd:
  enable: false
  disable_flectonepulse_status: true
# https://flectone.net/pulse/docs/integration/miniplaceholders
miniplaceholders:
  enable: false
# https://flectone.net/pulse/docs/integration/motd
motd:
  enable: false
  disable_flectonepulse_status: true
# https://flectone.net/pulse/docs/integration/placeholderapi
placeholderapi:
  enable: true
# https://flectone.net/pulse/docs/integration/plasmovoice
plasmovoice:
  enable: false
# https://flectone.net/pulse/docs/integration/simplevoice
simplevoice:
  enable: true
# https://flectone.net/pulse/docs/integration/skinsrestorer
skinsrestorer:
  enable: true
# https://flectone.net/pulse/docs/integration/supervanish
supervanish:
  enable: false
# https://flectone.net/pulse/docs/integration/tab
tab:
  enable: true
  disable_flectonepulse_scoreboard: true
  disable_flectonepulse_header: true
  disable_flectonepulse_footer: true
  disable_flectonepulse_playerlistname: true
# https://flectone.net/pulse/docs/integration/telegram
telegram:
  enable: false
  ignore_all_bots: true
  parse_mode: "NONE"
  token: ""
  custom_command:
    id:
      need_player: false
      aliases:
      - "!id"
    ping:
      need_player: true
      aliases:
      - "!ping"
  channel_info:
    enable: false
    ticker:
      enable: true
      period: 1200
  message_channel:
    INTEGRATION_TELEGRAM:
    - "123456"
    MESSAGE_CHAT_GLOBAL:
    - "123456"
  destination:
    type: "CHAT"
  sound:
    enable: false
# https://flectone.net/pulse/docs/integration/triton
triton:
  enable: true
# https://flectone.net/pulse/docs/integration/twitch
twitch:
  enable: false
  client_id: ""
  token: ""
  custom_command:
    ping:
      need_player: true
      aliases:
      - "!ping"
  message_channel:
    INTEGRATION_TWITCH:
    - "faseri4ka"
    MESSAGE_CHAT_GLOBAL:
    - "faseri4ka"
  follow_channel:
    faseri4ka:
    - "stream start https://twitch.tv/faseri4ka"
  destination:
    type: "CHAT"
  sound:
    enable: false
# https://flectone.net/pulse/docs/integration/vault
vault:
  enable: true
# https://flectone.net/pulse/docs/integration/yandex
yandex:
  enable: false
  token: ""
  folder_id: ""
