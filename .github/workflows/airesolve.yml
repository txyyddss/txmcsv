name: AI Help Issue Resolver

on:
  issues:
    types: [opened, labeled]
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  resolve-issues:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'AI Help') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_URL: ${{ secrets.openai_api_url }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Fetch issues with AI Help label
        id: fetch-issues
        run: |
          query='
          query GetAIHelpIssues {
            repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") {
              issues(first: 10, labels: ["AI Help"], states: [OPEN]) {
                nodes {
                  number
                  title
                  body
                  url
                }
              }
            }
          }
          '
          
          # Escape the GraphQL query for JSON
          query=$(echo "$query" | tr '\n' ' ')
          
          # Make GraphQL request to GitHub API
          ISSUES_JSON=$(curl -s -H "Authorization: bearer $GITHUB_TOKEN" \
            -X POST \
            -d "{\"query\": \"$query\"}" \
            https://api.github.com/graphql)
          
          # Save issues to file for processing
          echo "$ISSUES_JSON" > issues.json
          
          # Extract the number of issues
          ISSUES_COUNT=$(echo "$ISSUES_JSON" | jq -r '.data.repository.issues.nodes | length')
          echo "Found $ISSUES_COUNT issues with 'AI Help' label"
          echo "issues_count=$ISSUES_COUNT" >> $GITHUB_ENV
      
      - name: Generate file tree of configuration files
        id: generate-file-tree
        run: |
          # Create file tree focusing only on configuration files
          FILE_TREE=$(find . -type f \
            -name "*.yml" -o -name "*.yaml" -o -name "*.json" -o -name "*.toml" -o -name "*.conf" -o -name "*.config" -o -name "*.properties" -o -name "*.xml" \
            | grep -v "node_modules" \
            | grep -v ".git/" \
            | grep -v -E "(locale|lang)" \
            | sort)
          
          echo "FILE_TREE<<EOF" >> $GITHUB_ENV
          echo "$FILE_TREE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
      - name: Process issues with AI
        if: env.issues_count != '0'
        run: |
          # Process each issue
          for i in $(seq 0 $((${{ env.issues_count }}-1))); do
            ISSUE_NUMBER=$(cat issues.json | jq -r ".data.repository.issues.nodes[$i].number")
            ISSUE_TITLE=$(cat issues.json | jq -r ".data.repository.issues.nodes[$i].title")
            ISSUE_BODY=$(cat issues.json | jq -r ".data.repository.issues.nodes[$i].body" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
            
            echo "Processing issue #$ISSUE_NUMBER: $ISSUE_TITLE"
            
            # Create payload for AI API
            AI_PROMPT=$(cat << EOF
            你是一位专业的 Minecraft Paper 服务器配置专家。请帮助解决以下问题，只提供修改配置文件的解决方案，不要建议修改代码。

            ## 问题描述
            标题: $ISSUE_TITLE
            描述: $ISSUE_BODY

            ## 服务器配置文件结构
            ${{ env.FILE_TREE }}

            ## 要求
            1. 分析问题并提供简洁明了的解决方案
            2. 只建议修改配置文件，不要建议修改代码
            3. 可以提供多个解决方案（如果有）
            4. 如果认为无法通过修改配置解决问题，请明确说明，并在开头第一行写上"无法通过配置修改解决"
            5. 保持回答简洁但包含完整的解决方案

            请提供您的分析和建议:
            EOF
            )
            
            # Replace newlines with actual newlines for JSON
            AI_PROMPT=$(echo "$AI_PROMPT" | sed 's/\\n/\\\\n/g')
            
            # Call the AI API
            AI_RESPONSE=$(curl -s \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -d "{
                \"model\": \"deepseek-ai/DeepSeek-R1-Distill-Qwen-32B\",
                \"messages\": [{\"role\": \"user\", \"content\": \"$AI_PROMPT\"}],
                \"temperature\": 0.2
              }" \
              $OPENAI_API_URL)
            
            # Extract AI's response
            AI_ANSWER=$(echo "$AI_RESPONSE" | jq -r '.choices[0].message.content')
            
            # Check if AI determined the issue can't be fixed by changing configurations
            if echo "$AI_ANSWER" | grep -q "无法通过配置修改解决"; then
              # Add wontfix label
              curl -s \
                -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                -d "{\"labels\":[\"🙅wontfix\"]}" \
                "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/labels"
              
              echo "Added 🙅wontfix label to issue #$ISSUE_NUMBER"
            fi
            
            # Post comment with AI's solution
            COMMENT_DATA="{\"body\": \"## AI 解决方案\n\n$AI_ANSWER\n\n---\n*此回复由 AI 自动生成*\"}"
            COMMENT_DATA=$(echo "$COMMENT_DATA" | sed 's/\\n/\\\\n/g')
            
            curl -s \
              -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "$COMMENT_DATA" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments"
            
            echo "Posted AI solution to issue #$ISSUE_NUMBER"
          done
