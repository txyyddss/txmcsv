name: AI Help Issue Response

on:
  issues:
    types: [opened, labeled]

jobs:
  ai-help:
    if: ${{ contains(github.event.issue.labels.*.name, 'AI Help') }}
    runs-on: ubuntu-latest
    environment: AI
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_URL: ${{ secrets.openai_api_url }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      DEFAULT_API_URL: "https://api.openai.com/v1"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Process issue information
        run: |
          echo "ISSUE_NUMBER=${ISSUE_NUMBER}" >> $GITHUB_ENV
          echo "ISSUE_TITLE=${ISSUE_TITLE}" >> $GITHUB_ENV
          
          # 处理多行文本
          PROCESSED_BODY="${ISSUE_BODY//'%'/'%25'}"
          PROCESSED_BODY="${PROCESSED_BODY//$'\n'/'%0A'}"
          PROCESSED_BODY="${PROCESSED_BODY//$'\r'/'%0D'}"
          echo "PROCESSED_BODY=${PROCESSED_BODY}" >> $GITHUB_ENV

      - name: Generate config file tree
        id: file-tree
        run: |
          # 生成配置文件的文件树，排除数据文件、语言文件和包含locale/lang关键词的文件
          CONFIG_FILES=$(find . -type f -name "*.yml" -o -name "*.yaml" -o -name "*.json" -o -name "*.properties" -o -name "*.conf" -o -name "*.cfg" -o -name "*.toml" -o -name "*.xml" | grep -v "locale\|lang\|data\|language" | sort)
          
          # 创建文件树输出，只包含文件路径，不包含文件内容
          FILE_TREE="# Configuration Files\n"
          
          for file in $CONFIG_FILES; do
            # 只添加文件路径到文件树
            FILE_TREE="$FILE_TREE\n- $file"
          done
          
          # 处理多行文本
          FILE_TREE="${FILE_TREE//'%'/'%25'}"
          FILE_TREE="${FILE_TREE//$'\n'/'%0A'}"
          FILE_TREE="${FILE_TREE//$'\r'/'%0D'}"
          
          echo "FILE_TREE=$FILE_TREE" >> $GITHUB_ENV

      - name: Query AI for solution
        id: ai-solution
        run: |
          # 使用自定义URL或默认为OpenAI官方API
          if [ -n "${OPENAI_API_URL}" ]; then
            API_URL="${OPENAI_API_URL}"
          else
            API_URL="${DEFAULT_API_URL}"
          fi
          
          echo "Using API URL: $API_URL"
          
          # 准备提示信息
          PROMPT="你是一个专门帮助解决Minecraft Paper服务器配置问题的AI助手。请分析以下issue，并提供解决方案：

          Issue标题: ${ISSUE_TITLE}
          Issue内容: ${PROCESSED_BODY}

          以下是可用的配置文件列表：
          ${FILE_TREE}

          请提供一个简洁但完整的解决方案，专注于如何修改配置文件来解决这个问题。
          如果你认为这个问题无法通过修改配置文件解决，请明确说明'无法通过配置修改解决'。
          请不要提供除修改配置文件以外的解决方案。"
          
          # 调用API
          RESPONSE=$(curl -s -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -d "{
              \"model\": \"deepseek-ai/DeepSeek-R1-Distill-Qwen-32B\",
              \"messages\": [{\"role\": \"user\", \"content\": \"$PROMPT\"}],
              \"temperature\": 0.7
            }")
          
          # 检查是否有错误
          if [ -z "$RESPONSE" ] || echo "$RESPONSE" | jq -e '.error' > /dev/null; then
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // "Unknown API error"')
            echo "API请求失败: $ERROR_MSG" >&2
            echo "AI_RESPONSE=很抱歉，在处理您的请求时遇到了API错误。请联系管理员检查API配置。" >> $GITHUB_ENV
            echo "CANT_FIX=false" >> $GITHUB_ENV
            exit 0
          fi
          
          # 提取AI回答
          AI_RESPONSE=$(echo $RESPONSE | jq -r '.choices[0].message.content')
          
          # 确定是否可以通过配置修改解决
          if echo "$AI_RESPONSE" | grep -q "无法通过配置修改解决"; then
            echo "CANT_FIX=true" >> $GITHUB_ENV
          else
            echo "CANT_FIX=false" >> $GITHUB_ENV
          fi
          
          # 处理多行文本
          AI_RESPONSE="${AI_RESPONSE//'%'/'%25'}"
          AI_RESPONSE="${AI_RESPONSE//$'\n'/'%0A'}"
          AI_RESPONSE="${AI_RESPONSE//$'\r'/'%0D'}"
          
          echo "AI_RESPONSE=$AI_RESPONSE" >> $GITHUB_ENV

      - name: Add comment with solution
        uses: actions/github-script@v6
        with:
          github-token: ${{env.GITHUB_TOKEN}}
          script: |
            const issueNumber = process.env.ISSUE_NUMBER;
            const aiResponse = process.env.AI_RESPONSE.replace(/%0A/g, '\n').replace(/%0D/g, '\r').replace(/%25/g, '%');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## AI 助手解决方案\n\n${aiResponse}\n\n> 注：此回复由 AI 自动生成，如有疑问请联系管理员。`
            });

      - name: Add wontfix label if needed
        if: env.CANT_FIX == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{env.GITHUB_TOKEN}}
          script: |
            const issueNumber = process.env.ISSUE_NUMBER;
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['🙅wontfix']
            });
