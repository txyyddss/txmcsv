name: AI Help Issue Response

on:
  issues:
    types: [opened, labeled]

jobs:
  ai-help:
    if: ${{ contains(github.event.issue.labels.*.name, 'AI Help') }}
    runs-on: ubuntu-latest
    environment: AI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get issue information
        id: issue
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_ENV
          echo "ISSUE_TITLE=$ISSUE_TITLE" >> $GITHUB_ENV
          # 处理多行文本
          ISSUE_BODY="${ISSUE_BODY//'%'/'%25'}"
          ISSUE_BODY="${ISSUE_BODY//$'\n'/'%0A'}"
          ISSUE_BODY="${ISSUE_BODY//$'\r'/'%0D'}"
          echo "ISSUE_BODY=$ISSUE_BODY" >> $GITHUB_ENV

      - name: Generate config file tree
        id: file-tree
        run: |
          # 生成配置文件的文件树，排除数据文件、语言文件和包含locale/lang关键词的文件
          CONFIG_FILES=$(find . -type f -name "*.yml" -o -name "*.yaml" -o -name "*.json" -o -name "*.properties" -o -name "*.conf" -o -name "*.cfg" -o -name "*.toml" -o -name "*.xml" | grep -v "locale\|lang\|data\|language" | sort)
          
          # 创建文件树输出
          FILE_TREE="# Configuration Files\n"
          
          for file in $CONFIG_FILES; do
            # 添加文件到文件树
            FILE_TREE="$FILE_TREE\n- $file"
            
            # 对于小文件，可以添加内容
            if [ -f "$file" ] && [ $(wc -c < "$file") -lt 10240 ]; then
              FILE_TREE="$FILE_TREE\n\`\`\`\n$(cat $file)\n\`\`\`\n"
            else
              FILE_TREE="$FILE_TREE (file too large to display)"
            fi
          done
          
          # 处理多行文本
          FILE_TREE="${FILE_TREE//'%'/'%25'}"
          FILE_TREE="${FILE_TREE//$'\n'/'%0A'}"
          FILE_TREE="${FILE_TREE//$'\r'/'%0D'}"
          
          echo "FILE_TREE=$FILE_TREE" >> $GITHUB_ENV

      - name: Query AI for solution
        id: ai-solution
        run: |
          API_URL="${{ secrets.openai_api_url }}"
          
          # 准备提示信息
          PROMPT="你是一个专门帮助解决Minecraft Paper服务器配置问题的AI助手。请分析以下issue，并提供解决方案：

          Issue标题: ${{ env.ISSUE_TITLE }}
          Issue内容: ${{ env.ISSUE_BODY }}

          以下是可用的配置文件列表：
          ${{ env.FILE_TREE }}

          请提供一个简洁但完整的解决方案，专注于如何修改配置文件来解决这个问题。
          如果你认为这个问题无法通过修改配置文件解决，请明确说明'无法通过配置修改解决'。
          请不要提供除修改配置文件以外的解决方案。"
          
          # 调用API
          RESPONSE=$(curl -s -X POST "$API_URL/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -d "{
              \"model\": \"deepseek-r1\",
              \"messages\": [{\"role\": \"user\", \"content\": \"$PROMPT\"}],
              \"temperature\": 0.7
            }")
          
          # 提取AI回答
          AI_RESPONSE=$(echo $RESPONSE | jq -r '.choices[0].message.content')
          
          # 确定是否可以通过配置修改解决
          if echo "$AI_RESPONSE" | grep -q "无法通过配置修改解决"; then
            echo "CANT_FIX=true" >> $GITHUB_ENV
          else
            echo "CANT_FIX=false" >> $GITHUB_ENV
          fi
          
          # 处理多行文本
          AI_RESPONSE="${AI_RESPONSE//'%'/'%25'}"
          AI_RESPONSE="${AI_RESPONSE//$'\n'/'%0A'}"
          AI_RESPONSE="${AI_RESPONSE//$'\r'/'%0D'}"
          
          echo "AI_RESPONSE=$AI_RESPONSE" >> $GITHUB_ENV

      - name: Add comment with solution
        uses: actions/github-script@v6
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const issueNumber = process.env.ISSUE_NUMBER;
            const aiResponse = process.env.AI_RESPONSE.replace(/%0A/g, '\n').replace(/%0D/g, '\r').replace(/%25/g, '%');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## AI 助手解决方案\n\n${aiResponse}\n\n> 注：此回复由 AI 自动生成，如有疑问请联系管理员。`
            });

      - name: Add wontfix label if needed
        if: env.CANT_FIX == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const issueNumber = process.env.ISSUE_NUMBER;
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['🙅wontfix']
            });
