name: Create Bootstrap Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version label"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Build release metadata
        run: |
          TODAY="$(date +'%Y.%m.%d')"
          RELEASE_TAG="${TODAY}_${{ github.event.inputs.version }}"
          PACKAGE_NAME="txmcsv-bootstrap_${RELEASE_TAG}.7z"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"

      - name: Generate changelog
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let latestReleaseDate = null;
            try {
              const latestRelease = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              latestReleaseDate = new Date(latestRelease.data.created_at);
            } catch (error) {
              core.info('No previous release found; including all matching closed issues.');
            }

            const query = `
              query($owner:String!, $repo:String!, $states:[IssueState!]) {
                repository(owner:$owner, name:$repo) {
                  issues(states:$states, first:100, orderBy:{field:UPDATED_AT, direction:DESC}) {
                    nodes {
                      number
                      title
                      closedAt
                      labels(first:20) {
                        nodes {
                          name
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              states: ['CLOSED'],
            });

            const issues = result.repository.issues.nodes.filter((issue) => {
              if (!issue.closedAt) return false;
              if (latestReleaseDate && new Date(issue.closedAt) <= latestReleaseDate) return false;

              const labels = issue.labels.nodes.map((label) => label.name.toLowerCase());
              return !labels.some((label) =>
                label.includes('wontfix') ||
                label.includes('invalid') ||
                label.includes('potential-duplicate')
              );
            });

            const bugfixes = [];
            const features = [];
            const others = [];

            for (const issue of issues) {
              const normalizedTitle = issue.title
                .replace(/^\[bug\]:?\s*/i, '')
                .replace(/^\[feature request\]:?\s*/i, '')
                .trim();

              if (/^\[bug\]/i.test(issue.title)) {
                bugfixes.push(`- ${normalizedTitle} (#${issue.number})`);
              } else if (/^\[feature/i.test(issue.title)) {
                features.push(`- ${normalizedTitle} (#${issue.number})`);
              } else {
                others.push(`- ${normalizedTitle} (#${issue.number})`);
              }
            }

            let manualContent = '';
            if (fs.existsSync('manual.txt')) {
              manualContent = fs.readFileSync('manual.txt', 'utf8').trim();
            }

            const sections = ['# 更新内容', ''];
            sections.push('## 手动记录');
            sections.push(manualContent || '- 无');
            sections.push('');
            sections.push('## Bug 修复');
            sections.push(bugfixes.length ? bugfixes.join('\n') : '- 无');
            sections.push('');
            sections.push('## 功能与调整');
            sections.push(features.length ? features.join('\n') : '- 无');

            if (others.length) {
              sections.push('');
              sections.push('## 其他已关闭议题');
              sections.push(others.join('\n'));
            }

            fs.writeFileSync('CHANGELOG.md', sections.join('\n'));

      - name: Stage bootstrap package
        run: |
          rm -rf .release-bootstrap
          mkdir -p .release-bootstrap
          python3 <<'PY'
          import json
          import fnmatch
          import glob
          import shutil
          from pathlib import Path

          repo = Path('.').resolve()
          staging = repo / '.release-bootstrap'
          manifest = json.loads((repo / '.github' / 'bootstrap-manifest.json').read_text(encoding='utf-8'))

          include_patterns = manifest['include']
          exclude_patterns = manifest['exclude']

          def normalize(path: Path) -> str:
            return path.relative_to(repo).as_posix()

          def excluded(relpath: str) -> bool:
            return any(fnmatch.fnmatch(relpath, pattern) for pattern in exclude_patterns)

          files = set()
          for pattern in include_patterns:
            for match in glob.glob(str(repo / pattern), recursive=True):
              path = Path(match)
              if path.is_file():
                relpath = normalize(path)
                if not excluded(relpath):
                  files.add(relpath)

          for relpath in sorted(files):
            source = repo / relpath
            destination = staging / relpath
            destination.parent.mkdir(parents=True, exist_ok=True)
            shutil.copy2(source, destination)

          print(f"Staged {len(files)} files into {staging}")
          PY

      - name: Create bootstrap archive
        run: |
          cd .release-bootstrap
          7z a -t7z -mx=9 "../${PACKAGE_NAME}" ./*

      - name: Upload GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: ${{ env.PACKAGE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
