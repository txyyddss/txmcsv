name: AI Help Issue Resolver

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

jobs:
  resolve-ai-help-issue:
    runs-on: ubuntu-latest
    # 仅在Issue有"AI Help"标签或手动触发时运行
    if: contains(github.event.issue.labels.*.name, 'AI Help') || github.event_name == 'workflow_dispatch'
    environment: AI
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Get latest AI Help issue
        id: get-issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const query = `
            query GetAIHelpIssue {
              repository(owner: "${context.repo.owner}", name: "${context.repo.repo}") {
                issues(first: 1, states: OPEN, orderBy: {field: CREATED_AT, direction: DESC}, labels: ["AI Help"]) {
                  nodes {
                    number
                    title
                    body
                    url
                  }
                }
              }
            }`;
            
            const result = await github.graphql(query);
            const issues = result.repository.issues.nodes;
            
            if (issues.length === 0) {
              console.log('No open issues with "AI Help" label found');
              return core.setFailed('No open issues with "AI Help" label found');
            }
            
            const issue = issues[0];
            console.log(`Processing issue #${issue.number}: ${issue.title}`);
            
            // 提取Issue中的图片链接
            const imageRegex = /!\[.*?\]\((.*?)\)/g;
            const imageLinks = [];
            let match;
            while ((match = imageRegex.exec(issue.body)) !== null) {
              imageLinks.push(match[1]);
            }
            
            core.setOutput('issue-number', issue.number);
            core.setOutput('issue-title', issue.title);
            core.setOutput('issue-body', issue.body);
            core.setOutput('issue-url', issue.url);
            core.setOutput('image-links', JSON.stringify(imageLinks));
      

      - name: Generate file tree
        id: file-tree
        run: |
          # 生成仅包含关键配置文件的文件树
          echo "::group::Config Files Tree"
          
          # 查找配置文件但排除数据/语言文件等
          find . \
            -name "*.yml" -o -name "*.yaml" -o -name "*.json" -o -name "*.properties" -o -name "*.conf" -o -name "*.cfg" -o -name "*.toml" -o -name "config.txt" \
            | grep -v "node_modules" \
            | grep -v ".git" \
            | grep -v "/world/" \
            | grep -v "/logs/" \
            | grep -v "/cache/" \
            | grep -v "/backup/" \
            | grep -v "/crash-reports/" \
            | grep -v "/libraries/" \
            | grep -v "/versions/" \
            | grep -v "/assets/" \
            | grep -v "/tmp/" \
            | grep -v "/temp/" \
            | grep -v "\.dat$" \
            | grep -v "\.mca$" \
            | grep -v "\/playerdata\/" \
            | grep -v "\/advancements\/" \
            | grep -v "\/stats\/" \
            | grep -v "\/data\/" \
            | grep -v "\/region\/" \
            | grep -iv "locale" \
            | grep -iv "lang" \
            | grep -iv "i18n" \
            | grep -iv "translation" \
            | grep -i -e "config" -e "settings" -e "permissions" -e "bukkit" -e "spigot" -e "paper" -e "plugin" \
            | sort > config_files.txt
          
          # 显示找到的配置文件
          cat config_files.txt
          echo "::endgroup::"
          
          # 创建配置文件树文本
          CONFIG_TREE=$(cat config_files.txt | sed 's/^/- /')
          echo "FILE_TREE<<EOF" >> $GITHUB_ENV
          echo "以下是服务器关键配置文件列表:" >> $GITHUB_ENV
          echo "$CONFIG_TREE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
      - name: Process images
        id: process-images
        run: |
          IMAGE_LINKS='${{ steps.get-issue.outputs.image-links }}'
          if [ "$IMAGE_LINKS" != "[]" ]; then
            echo "Issue contains images. Adding image references to prompt."
            IMAGE_SECTION="The issue contains the following images:\n"
            for link in $(echo $IMAGE_LINKS | jq -r '.[]'); do
              IMAGE_SECTION+="- $link\n"
            done
            echo "IMAGE_SECTION<<EOF" >> $GITHUB_ENV
            echo -e "$IMAGE_SECTION" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "No images found in the issue."
            echo "IMAGE_SECTION=" >> $GITHUB_ENV
          fi
      

      - name: Call AI API for solution
        id: ai-solution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_NUMBER: ${{ steps.get-issue.outputs.issue-number }}
          ISSUE_TITLE: ${{ steps.get-issue.outputs.issue-title }}
          ISSUE_BODY: ${{ steps.get-issue.outputs.issue-body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Prepare prompt for Deepseek model (in English)
          PROMPT=$(cat <<'EOT'
          You are a Minecraft Paper server configuration expert. Analyze the following issue and provide a concise solution.
          ## Issue Details
          Issue #$ISSUE_NUMBER: $ISSUE_TITLE
          
          Description:
          $ISSUE_BODY
          
          $IMAGE_SECTION
          
          ## Configuration Files
          $FILE_TREE
          
          If this issue CAN be solved by configuration changes, provide your solution in this EXACT format:
          ```markdown
          ### Files to Modify
          - file/path1
          - file/path2
          
          ### Changes
          - file/path1:
            ```yaml
            setting: new_value
            ```
          - file/path2:
            ```yaml
            setting: new_value
            ```
          ```
          
          If this issue CANNOT be solved by configuration changes alone, respond EXACTLY with:
          ```
          WONTFIX: [brief reason why configuration changes won't solve this]
          ```
          
          Your response must:
          - Skip all reasoning steps and thinking process
          - Direct answers only
          - Focus only on configuration file changes
          - Be under 250 words
          - Follow the EXACT format specified above
          EOT
          )
          
          # Process environment variable replacements
          PROMPT="${PROMPT//\$ISSUE_NUMBER/$ISSUE_NUMBER}"
          PROMPT="${PROMPT//\$ISSUE_TITLE/$ISSUE_TITLE}"
          PROMPT="${PROMPT//\$ISSUE_BODY/$ISSUE_BODY}"
          PROMPT="${PROMPT//\$IMAGE_SECTION/$IMAGE_SECTION}"
          PROMPT="${PROMPT//\$FILE_TREE/$FILE_TREE}"
          
          # Escape JSON string properly
          ESCAPED_PROMPT=$(echo "$PROMPT" | jq -Rs .)
          
          # Use custom API URL if provided
          API_URL="${{ secrets.OPENAI_API_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://api.openai.com/v1/chat/completions"
          fi
          
          # Build request JSON for Deepseek model
          REQUEST_JSON=$(cat <<EOF
          {
            "model": "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B",
            "messages": [
              {
                "role": "system", 
                "content": "You are a Minecraft Paper server configuration expert. Provide direct configuration changes only without any reasoning or thought process. If the issue cannot be solved by configuration changes, respond with 'WONTFIX: [reason]'. Use the exact format specified in the user's request."
              },
              {
                "role": "user",
                "content": ${ESCAPED_PROMPT}
              }
            ],
            "temperature": 0.7,
            "max_tokens": 3000
          }
          EOF
          )
          
          # Call API
          RESPONSE=$(curl -s -X POST "$API_URL" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_JSON")
          
          # Check if API call was successful
          if [[ $RESPONSE == *"error"* ]]; then
            echo "API Error: $RESPONSE"
            exit 1
          fi
          
          # Extract and clean the response content
          RAW_SOLUTION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          
          # Advanced cleaning to remove thinking process
          SOLUTION=$(echo "$RAW_SOLUTION" | \
            # Remove thinking phrases in English
            sed -E '/^(Let me|I think|First|Let\'s|After|Based on|According to|Looking at)/d' | \
            sed -E 's/^(Let me|I think|First|Let\'s|After|Based on|According to|Looking at).*$//' | \
            # Remove thinking phrases in Chinese
            sed -E '/^(让我|我认为|首先|让我们|分析|思考|根据|查看)/d' | \
            sed -E 's/^(让我|我认为|首先|让我们|分析|思考|根据|查看).*$//' | \
            # Remove specific thinking markers
            sed '/^Reasoning:/d' | \
            sed '/^Thought:/d' | \
            sed '/^Analysis:/d' | \
            sed '/^Step [0-9]:/d' | \
            sed '/^思路:/d' | \
            sed '/^分析:/d' | \
            sed '/^思考:/d' | \
            # Remove common explanation phrases
            sed -E 's/This is because.*$//' | \
            sed -E 's/The reason is.*$//' | \
            sed -E 's/We need to.*$//' | \
            sed -E 's/这是因为.*$//' | \
            sed -E 's/原因是.*$//' | \
            sed -E 's/我们需要.*$//' | \
            # Extract only the solution part
            grep -v "^$" | \
            # Detect if we have a WONTFIX response or a config solution
            awk '/^WONTFIX:/{print; exit} /^### Files to Modify/,0{print}')
          
          # Check if solution contains WONTFIX indicator
          if [[ "$SOLUTION" == *"WONTFIX:"* ]]; then
            echo "AI determined this cannot be fixed by configuration changes."
            
            # Extract the reason
            WONTFIX_REASON=$(echo "$SOLUTION" | grep -o "WONTFIX:.*" | sed 's/WONTFIX: //')
            
            # Add wontfix label to the issue
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER/labels" \
              -d "{\"labels\":[\"🙅wontfix\"]}"
              
            # Comment on the issue with the reason
            COMMENT="**Cannot be solved through configuration:**\n\n${WONTFIX_REASON}\n\n*This issue has been labeled as wontfix as the AI determined configuration changes alone cannot resolve it.*"
            ESCAPED_COMMENT=$(echo "$COMMENT" | jq -Rs .)
            
            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/issues/$ISSUE_NUMBER/comments" \
              -d "{\"body\":${ESCAPED_COMMENT}}"
          fi
          
          # Save solution
          echo "$SOLUTION" > solution.md
          echo "SOLUTION<<EOF" >> $GITHUB_ENV
          echo "$SOLUTION" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Comment on Issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = ${{ steps.get-issue.outputs.issue-number }};
            const solution = process.env.SOLUTION;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## AI-Generated Solution\n\n${solution}\n\n---\n*This solution was automatically generated by AI. If it doesn't address your issue completely, please wait until administrator process is manually.*`
            });
            
            console.log(`Posted solution to issue #${issueNumber}`);
