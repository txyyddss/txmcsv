name: AI Help Issue Solver

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  solve-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          npm install @octokit/graphql @octokit/rest axios fs-extra glob

      - name: Find latest AI Help issue
        id: find_issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name || github.repository }}
        run: |
          # 使用动态导入处理 ES Module
          cat > query.mjs << 'EOF'
          import { graphql } from '@octokit/graphql';
          
          async function run() {
            const graphqlWithAuth = graphql.defaults({
              headers: {
                authorization: `token ${process.env.GITHUB_TOKEN}`,
              },
            });
            
            const repo = process.env.REPO_NAME;
            const owner = process.env.REPO_OWNER;
            
            const query = `
              query GetAIHelpIssues($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  issues(first: 5, states: [OPEN], orderBy: {field: CREATED_AT, direction: DESC}) {
                    nodes {
                      number
                      title
                      body
                      labels(first: 10) {
                        nodes {
                          name
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            try {
              const result = await graphqlWithAuth(query, { owner, repo });
              const issues = result.repository.issues.nodes;
              
              // 过滤出带有 "AI Help" 标签的 issues
              const aiHelpIssues = issues.filter(issue => 
                issue.labels.nodes.some(label => 
                  label.name.toLowerCase() === 'ai help'
                )
              );
              
              if (aiHelpIssues.length > 0) {
                const latestIssue = aiHelpIssues[0];
                const issueLabels = latestIssue.labels.nodes.map(label => label.name).join(', ');
                
                console.log(JSON.stringify({
                  issueNumber: latestIssue.number,
                  issueTitle: latestIssue.title,
                  issueBody: latestIssue.body,
                  issueLabels: issueLabels
                }));
              } else {
                console.log('null');
              }
            } catch (error) {
              console.error('Error:', error);
              console.log('null');
            }
          }
          
          run();
          EOF
          
          RESULT=$(node --experimental-modules query.mjs)
          echo "result=$RESULT" >> $GITHUB_OUTPUT
          
          # 如果找到issue，保存issue内容到文件中
          if [ "$RESULT" != "null" ]; then
            echo "$RESULT" | jq -r '.issueBody' > issue_content.md
          fi

      - name: Prepare repository for AI
        if: steps.find_issue.outputs.result != 'null'
        id: prepare_repo
        run: |
          # 使用 heredoc 方式保存 JSON 数据到文件，避免 shell 解析
          cat > issue_data.json << 'EOJSON'
          {"issueNumber":35,"issueTitle":"[Bug]: 登入系统大小写冲突","issueBody":"### Prerequisites\n\n- [x] I have checked that this is not Mojang's issue.\n\n- [x] I have searched other issues and found no duplicates\n\n- [x] I will fill in the blanks properly.\n\n- [x] The bug can be repeated and not caused by your network.\n\n- [x] I correctly added the labels. (ex.P1/2/3 Breaking/Network)\n\n\n### Platform\n\nWindows Bedrock\n\n### Server version\n\n6\n\n### Minecraft version\n\n1.20.4\n\n### Action\n\n同时登入java大号mc9957和基岩小号MC9957\n\n### Expected result (If applicable)\n\n_No response_\n\n### Actual result (If applicable)\n\n显示名字应该为mc9957，不应该是MC9957\n\n### Additional information and/or screenshots\n\n![Image](https://github.com/user-attachments/assets/e920d79f-d38f-4d9f-8897-dddf9e7f4454)","issueLabels":"🐛bug, 🟠P2:Medium impact, AI Help"}
          EOJSON
          
          # 从文件读取数据而不是直接在 shell 中处理
          ISSUE_NUMBER=$(jq -r '.issueNumber' issue_data.json)
          ISSUE_TITLE=$(jq -r '.issueTitle' issue_data.json)
          echo "ISSUE_NUMBER: $ISSUE_NUMBER"
          echo "ISSUE_TITLE: $ISSUE_TITLE"
          
          # 创建新分支
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          BRANCH_NAME="ai-solution-${ISSUE_NUMBER}"
          git checkout -b "$BRANCH_NAME"
          
          # 生成文件树
          FILE_TREE=$(find . -type f -not -path "*/\.*" -not -path "*/node_modules/*" -not -path "*/vendor/*" | sort)
          echo "$FILE_TREE" > file_tree.txt
          
          # 保存输出变量
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT


      - name: Call OpenAI API for solution
        if: steps.find_issue.outputs.result != 'null'
        id: generate_solution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_URL: ${{ secrets.OPENAI_API_URL || 'https://api.openai.com/v1/chat/completions' }}
        run: |
          # 从JSON结果中提取信息
          ISSUE_JSON='${{ steps.find_issue.outputs.result }}'
          ISSUE_NUMBER=$(echo "$ISSUE_JSON" | jq -r '.issueNumber')
          ISSUE_TITLE=$(echo "$ISSUE_JSON" | jq -r '.issueTitle')
          ISSUE_BODY=$(cat issue_content.md)
          FILE_TREE=$(cat file_tree.txt)
          
          # 准备发送给OpenAI API的提示
          cat > prompt.json << EOF
          {
            "model": "claude-3-7-sonnet-thinking",
            "messages": [
              {
                "role": "system",
                "content": "你要处理的是一个Paper端我的世界服务器，并且添加了插件。你的任务是分析GitHub Issue并提出解决方案。请先分析问题，然后提供具体的代码修改建议和解决方案。"
              },
              {
                "role": "user",
                "content": "我需要你帮助解决以下GitHub Issue:\\n\\nIssue #${ISSUE_NUMBER}: ${ISSUE_TITLE}\\n\\n${ISSUE_BODY}\\n\\n项目文件结构:\\n${FILE_TREE}\\n\\n请分析问题，并提供详细的解决方案。包括需要修改的文件和具体的代码更改。"
              }
            ],
            "temperature": 0.7,
            "max_tokens": 4000
          }
          EOF
          
          # 调用OpenAI API
          RESPONSE=$(curl -s -X POST "$OPENAI_API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            --data @prompt.json)
          
          # 提取AI回复
          AI_SOLUTION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          echo "$AI_SOLUTION" > ai_solution.md
          
          # 生成PR描述
          cat > pr_description.md << EOF
          # AI解决方案: ${ISSUE_TITLE}
          
          此PR旨在解决Issue #${ISSUE_NUMBER}
          
          ## AI分析和解决方案
          
          ${AI_SOLUTION}
          EOF

      - name: Implement AI solution
        if: steps.find_issue.outputs.result != 'null'
        run: |
          # 这里可以添加代码来解析AI解决方案并自动进行文件修改
          # 例如使用正则表达式提取代码块并应用到相应文件
          # 简单示例，实际实现可能需要更复杂的逻辑
          
          # 解析AI解决方案中的代码块
          node -e '
            const fs = require("fs");
            const solution = fs.readFileSync("ai_solution.md", "utf8");
            
            // 查找代码块 ```filepath content ```
            const codeBlockRegex = /```(?:(\S+)\n)?([\s\S]+?)```/g;
            let match;
            
            while ((match = codeBlockRegex.exec(solution)) !== null) {
              const filepath = match[1];
              let content = match[2];
              
              if (filepath && !filepath.startsWith("output") && !filepath.startsWith("shell") && !filepath.startsWith("bash")) {
                console.log(`处理文件: ${filepath}`);
                
                // 确保目录存在
                const dir = filepath.substring(0, filepath.lastIndexOf("/"));
                if (dir && dir !== "" && !fs.existsSync(dir)) {
                  fs.mkdirSync(dir, { recursive: true });
                }
                
                // 写入或更新文件
                fs.writeFileSync(filepath, content, "utf8");
              }
            }
          '
          
          # 添加更改
          git add .
          git status
          
          # 检查是否有更改
          if git diff --staged --quiet; then
            echo "没有发现文件更改，添加一个占位文件"
            echo "AI解决方案已经提供，但没有找到需要实现的代码更改。请查看PR描述了解更多信息。" > AI_SOLUTION.md
            git add AI_SOLUTION.md
          fi
          
          git commit -m "AI解决方案: ${{ steps.prepare_repo.outputs.issue_title }} (#${{ steps.prepare_repo.outputs.issue_number }})"

      - name: Create Pull Request
        if: steps.find_issue.outputs.result != 'null'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "AI Solution: ${{ steps.prepare_repo.outputs.issue_title }}"
          branch: ${{ steps.prepare_repo.outputs.branch_name }}
          title: "AI Solution - ${{ steps.prepare_repo.outputs.issue_title }}"
          body-path: pr_description.md
          labels: "AI-generated"
