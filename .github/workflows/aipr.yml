name: AI Issue Processor

on:
  workflow_dispatch:

env:
  AI_MODEL: claude-3-7-sonnet-all
  MAX_TOKENS: 4000

jobs:
  process-issue:
    runs-on: ubuntu-latest
    environment: AI
    permissions:
      issues: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup GraphQL query
      id: get-issue
      uses: actions/github-script@v6
      with:
        script: |
          const query = `query ($owner: String!, $repo: String!) {
            repository(owner: $owner, name: $repo) {
              issues(labels: ["AI Help"], states: OPEN, first: 1, orderBy: {field: UPDATED_AT, direction: DESC}) {
                nodes {
                  number
                  body
                  author {
                    login
                  }
                }
              }
            }
          }`;
          
          const result = await github.graphql(query, {
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          
          const issue = result.repository.issues.nodes[0];
          core.setOutput('number', issue.number);
          core.setOutput('body', issue.body);
          core.setOutput('author', issue.author.login);

    - name: Generate file structure
      id: file-structure
      run: |
        sudo apt-get update
        sudo apt-get install -y tree
        tree -a -I '.git|node_modules|logs|cache|plugins' --noreport > file_tree.txt
        echo "FILE_TREE=$(cat file_tree.txt)" >> $GITHUB_ENV

    - name: Extract image URLs
      id: extract-images
      run: |
        IMAGE_URLS=$(grep -oE '\!\[.*\]\(https?:\/\/[^\)]+\)' <<< "${{ steps.get-issue.outputs.body }}" | sed 's/.*(//;s/)//' | tr '\n' ' ')
        echo "image_urls=$IMAGE_URLS" >> $GITHUB_OUTPUT

    - name: Create AI prompt
      id: create-prompt
      run: |
        PROMPT=$(cat <<EOF
        你是一个经验丰富的Minecraft服务器管理员，请分析以下Paper服务器问题：

        ### 问题描述：
        ${{ steps.get-issue.outputs.body }}

        ### 文件结构：
        $(cat file_tree.txt)

        ### 相关图片链接：
        ${{ steps.extract-images.outputs.image_urls }}

        请：
        1. 分析可能的问题原因
        2. 给出具体的解决方案
        3. 说明需要修改的配置文件及位置
        4. 注意插件兼容性问题
        请用中文回答，保持专业但易于理解。
        EOF
        )
        echo "PROMPT=$PROMPT" >> $GITHUB_ENV

    - name: Call Claude API
      id: call-api
      run: |
        RESPONSE=$(curl -s -X POST "${{ secrets.openai_api_url }}" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
          -d @- <<EOF
        {
          "model": "${{ env.AI_MODEL }}",
          "max_tokens": ${{ env.MAX_TOKENS }},
          "messages": [
            {
              "role": "user",
              "content": "${{ env.PROMPT }}"
            }
          ]
        }
        EOF
        )

        echo "API Response: $RESPONSE"
        COMMENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
        echo "comment=$COMMENT" >> $GITHUB_OUTPUT

    - name: Post AI response
      uses: actions/github-script@v6
      with:
        script: |
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: ${{ steps.get-issue.outputs.number }},
            body: `🤖 **AI分析结果**（由@${{ steps.get-issue.outputs.author }} 触发）\n\n${{ steps.call-api.outputs.comment }}`
          });