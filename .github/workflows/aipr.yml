name: AI Help Issue Resolver

on:
  workflow_dispatch:

jobs:
  resolve-ai-help-issue:
    runs-on: ubuntu-latest
    # 仅在Issue有"AI Help"标签或手动触发时运行
    if: contains(github.event.issue.labels.*.name, 'AI Help') || github.event_name == 'workflow_dispatch'
    environment: AI
    env: 
      model: gemini-2.0-flash
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Get latest AI Help issue
        id: get-issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const query = `
            query GetAIHelpIssue {
              repository(owner: "${context.repo.owner}", name: "${context.repo.repo}") {
                issues(first: 1, states: OPEN, orderBy: {field: CREATED_AT, direction: DESC}, labels: ["AI Help"]) {
                  nodes {
                    number
                    title
                    body
                    url
                  }
                }
              }
            }`;
            
            const result = await github.graphql(query);
            const issues = result.repository.issues.nodes;
            
            if (issues.length === 0) {
              console.log('No open issues with "AI Help" label found');
              return core.setFailed('No open issues with "AI Help" label found');
            }
            
            const issue = issues[0];
            console.log(`Processing issue #${issue.number}: ${issue.title}`);
            
            // 提取Issue中的图片链接
            const imageRegex = /!\[.*?\]\((.*?)\)/g;
            const imageLinks = [];
            let match;
            while ((match = imageRegex.exec(issue.body)) !== null) {
              imageLinks.push(match[1]);
            }
            
            core.setOutput('issue-number', issue.number);
            core.setOutput('issue-title', issue.title);
            core.setOutput('issue-body', issue.body);
            core.setOutput('issue-url', issue.url);
            core.setOutput('image-links', JSON.stringify(imageLinks));
      

      - name: Generate file tree
        id: file-tree
        run: |
          # 生成仅包含关键配置文件的文件树
          echo "::group::Config Files Tree"
          
          # 查找配置文件但排除数据/语言文件等
          find . \
            -name "*.yml" -o -name "*.yaml" -o -name "*.json" -o -name "*.properties" -o -name "*.conf" -o -name "*.cfg" -o -name "*.toml" -o -name "config.txt" \
            | grep -v "node_modules" \
            | grep -v ".git" \
            | grep -v "/world/" \
            | grep -v "/logs/" \
            | grep -v "/cache/" \
            | grep -v "/backup/" \
            | grep -v "/crash-reports/" \
            | grep -v "/libraries/" \
            | grep -v "/versions/" \
            | grep -v "/assets/" \
            | grep -v "/tmp/" \
            | grep -v "/temp/" \
            | grep -v "\.dat$" \
            | grep -v "\.mca$" \
            | grep -v "\/playerdata\/" \
            | grep -v "\/advancements\/" \
            | grep -v "\/stats\/" \
            | grep -v "\/data\/" \
            | grep -v "\/region\/" \
            | grep -iv "locale" \
            | grep -iv "lang" \
            | grep -iv "i18n" \
            | grep -iv "translation" \
            | grep -i -e "config" -e "settings" -e "permissions" -e "bukkit" -e "spigot" -e "paper" -e "plugin" \
            | sort > config_files.txt
          
          # 显示找到的配置文件
          cat config_files.txt
          echo "::endgroup::"
          
          # 创建配置文件树文本
          CONFIG_TREE=$(cat config_files.txt | sed 's/^/- /')
          echo "FILE_TREE<<EOF" >> $GITHUB_ENV
          echo "以下是服务器关键配置文件列表:" >> $GITHUB_ENV
          echo "$CONFIG_TREE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
      - name: Process images
        id: process-images
        run: |
          IMAGE_LINKS='${{ steps.get-issue.outputs.image-links }}'
          if [ "$IMAGE_LINKS" != "[]" ]; then
            echo "Issue contains images. Adding image references to prompt."
            IMAGE_SECTION="The issue contains the following images:\n"
            for link in $(echo $IMAGE_LINKS | jq -r '.[]'); do
              IMAGE_SECTION+="- $link\n"
            done
            echo "IMAGE_SECTION<<EOF" >> $GITHUB_ENV
            echo -e "$IMAGE_SECTION" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "No images found in the issue."
            echo "IMAGE_SECTION=" >> $GITHUB_ENV
          fi
      

      - name: Call Claude API for solution
        id: claude-solution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_NUMBER: ${{ steps.get-issue.outputs.issue-number }}
          ISSUE_TITLE: ${{ steps.get-issue.outputs.issue-title }}
          ISSUE_BODY: ${{ steps.get-issue.outputs.issue-body }}
        run: |
          # 准备Gemini的提示并转义JSON特殊字符
          PROMPT=$(cat <<'EOT'
          你是Minecraft Paper服务器配置专家。请分析以下问题并提供简短的解决方案。
          ## 问题详情
          Issue #$ISSUE_NUMBER: $ISSUE_TITLE
          
          描述:
          $ISSUE_BODY
          
          $IMAGE_SECTION
          
          ## 配置文件列表
          $FILE_TREE
          
          请提供：
          1. 需要修改的配置文件路径
          2. 应该如何修改这些配置（具体的参数和值）
          3. 简短说明这些更改会解决什么问题
          你可以上网搜索解决方案
          你的回答必须：
          - 仅关注配置文件的修改
          - 不超过250字
          - 使用markdown格式
          - 不提供配置文件修改以外的解决方案
          - 不提供长篇解释或背景信息
          EOT
          )
          
          # 处理环境变量替换
          PROMPT="${PROMPT//\$ISSUE_NUMBER/$ISSUE_NUMBER}"
          PROMPT="${PROMPT//\$ISSUE_TITLE/$ISSUE_TITLE}"
          PROMPT="${PROMPT//\$ISSUE_BODY/$ISSUE_BODY}"
          PROMPT="${PROMPT//\$IMAGE_SECTION/$IMAGE_SECTION}"
          PROMPT="${PROMPT//\$FILE_TREE/$FILE_TREE}"
          
          # 使用jq正确转义JSON字符串
          ESCAPED_PROMPT=$(echo "$PROMPT" | jq -Rs .)
          
          # 使用自定义API URL（如果提供）
          API_URL="${{ secrets.OPENAI_API_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://api.openai.com/v1/chat/completions"
          fi
          
          # 构建请求JSON
          REQUEST_JSON=$(cat <<EOF
          {
            "model": "$model",
            "messages": [
              {
                "role": "system", 
                "content": "你是Minecraft Paper服务器配置专家。提供简短、直接的配置文件修改建议。不要解释原理，只给出具体修改。"
              },
              {
                "role": "user",
                "content": ${ESCAPED_PROMPT}
              }
            ],
            "temperature": 0.2,
            "max_tokens": 1000
          }
          EOF
          )
          
          # 调用API
          RESPONSE=$(curl -s -X POST "$API_URL" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_JSON")
          
          # 检查API调用是否成功
          if [[ $RESPONSE == *"error"* ]]; then
            echo "API Error: $RESPONSE"
            exit 1
          fi
          
          # 提取响应内容
          SOLUTION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          
          # 保存解决方案
          echo "$SOLUTION" > solution.md
          echo "SOLUTION<<EOF" >> $GITHUB_ENV
          echo "$SOLUTION" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Comment on Issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = ${{ steps.get-issue.outputs.issue-number }};
            const solution = process.env.SOLUTION;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## AI-Generated Solution\n\n${solution}\n\n---\n*This solution was automatically generated by Claude 3.7 Sonnet. If it doesn't address your issue completely, please provide more details.*`
            });
            
            console.log(`Posted solution to issue #${issueNumber}`);
